    // 解析单条 latest_data：返回 {parts, hits}，不直接修改页面状态
    // parts：可单独点击启用的子选项（按单个生肖/号码/数字/元素/颜色/天气拆分）
    function processImportedItem(str, title) {
        const parts = [];
        const hits = [];
        const seenEffectKeys = new Set(); // 类别效果去重：同一类别同一值只入一次

        // 预扫描：含加号的合集括号区间（【A+B】）。合集内词条统一由“规则9.5 合集”展开为号码并集，
        // 避免被类别词条规则（9.6）或分组关键字规则（7）重复识别成类别效果（会导致交集冲突）
        const plusBracketRanges = [];
        const plusBracketRe = /[〖【]([^〗】]+)[〗】]/g;
        let plusBracket;
        while ((plusBracket = plusBracketRe.exec(str)) !== null) {
            if (/[+＋]/.test(plusBracket[1])) plusBracketRanges.push({ start: plusBracket.index, end: plusBracketRe.lastIndex });
        }
        const inPlusBracket = idx => plusBracketRanges.some(r => idx >= r.start && idx < r.end);

        // 规则0：选入/杀死标记（油猴自定义模板“内容标记”输出）——整条按标记识别并直接返回，
        // 不再走下面规则，避免“绝杀三肖”等正文词与标记语义冲突（同一批生肖既被杀又被选）
        const hasPickMark = /【选入】/.test(str);
        const hasKillMark = /【杀死】/.test(str);
        if (hasPickMark || hasKillMark) {
            const isKill = !!hasKillMark;
            // 类别词条识别（仅选入标记）：标题或正文含 琴棋书画/风雨雷电/春夏秋冬 时，
            // 从正文括号取组字（组字间可有空格，如 【画 书 棋】），避免“必开【画 书 棋】”等被丢弃
            if (!isKill) {
                const markedGroupRules = [
                    { keyword: '琴棋书画', cat: 'art', label: '琴棋书画', chars: { '琴': 'qin', '棋': 'qi', '书': 'shu', '画': 'hua' } },
                    { keyword: '风雨雷电', cat: 'weather', label: '风雨雷电', chars: { '风': 'wind', '雨': 'rain', '雷': 'thunder', '电': 'electric' } },
                    { keyword: '春夏秋冬', cat: 'season', label: '春夏秋冬', chars: { '春': 'spring', '夏': 'summer', '秋': 'autumn', '冬': 'winter' } },
                    { keyword: '四季', cat: 'season', label: '春夏秋冬', chars: { '春': 'spring', '夏': 'summer', '秋': 'autumn', '冬': 'winter' } }
                ];
                const markedSearchText = (title ? String(title) : '') + '\u0001' + str;
                markedGroupRules.forEach(gr => {
                    if (!markedSearchText.includes(gr.keyword)) return;
                    const found = [];
                    const gSeen = new Set();
                    const markedBracketRe = /[〖【]([^〗】]*)[〗】]/g;
                    let mb;
                    while ((mb = markedBracketRe.exec(str)) !== null) {
                        if (inPlusBracket(mb.index)) continue;
                        Array.from(mb[1]).forEach(ch => {
                            if (gr.chars[ch] && !gSeen.has(ch)) { gSeen.add(ch); found.push(ch); }
                        });
                    }
                    if (!found.length) { // 无括号时兼容 风雨雷电：风雨 等写法
                        let ki = 0;
                        while ((ki = str.indexOf(gr.keyword, ki)) > -1) {
                            Array.from(str.slice(ki + gr.keyword.length, ki + gr.keyword.length + 16)).forEach(ch => {
                                if (gr.chars[ch] && !gSeen.has(ch)) { gSeen.add(ch); found.push(ch); }
                            });
                            ki += gr.keyword.length;
                        }
                    }
                    if (found.length) {
                        found.forEach(ch => parts.push({ cat: gr.cat, label: gr.label, value: gr.chars[ch], display: ch, kind: 'effect' }));
                        hits.push("<span style='color:#0d9488;'>筛选:</span> " + found.map(ch => gr.label + '·' + ch).join('、'));
                    }
                });
            }
            // 尾类内容优先：绝杀二尾【7尾.5尾】/六尾 0.1.2.3.4.8尾 等按 杀尾/尾数 识别，
            // 而不是把 7、5 等误当成杀码/特码号码（尾部是集合语义，不是单个号码）
            const tailHead = str.match(/(?:绝杀|死杀|必杀)?(?:六尾|尾数|[一二三四五六七八九十]尾|杀尾)/);
            if (tailHead) {
                const afterSeg = str.slice(tailHead.index + tailHead[0].length, tailHead.index + tailHead[0].length + 16);
                const tailBracket = afterSeg.match(/[〖【]([^〗】]*)[〗】]/);
                const seg = tailBracket ? tailBracket[1] : afterSeg;
                const tailStr = seg.replace(/[^\d.]+/g, '.');
                // 括号内如 【124679尾】 是连续数字串：逐位取尾；无括号仍按 点号/空格 分隔的单个数字识别
                const tails = tailBracket
                    ? (seg.match(/\d/g) || [])
                    : tailStr.split('.').filter(t => /^\d$/.test(t));
                if (tails.length) {
                    tails.forEach(t => parts.push({ cat: isKill ? 'frozen' : 'lastDigit', label: isKill ? '杀尾' : '尾数', value: t, display: t + '尾', kind: 'digit' }));
                    hits.push("<span style='color:" + (isKill ? '#ef4444' : '#0891b2') + ";'>" + (isKill ? '杀尾(标记):' : '尾数(标记):') + "</span> " + tails.join(','));
                    parts.forEach(p => { if (p.checked === undefined) p.checked = true; });
                    return { parts: parts, hits: hits };
                }
            }
            const zodList = (str.match(/[鼠牛虎兔龙蛇马羊猴鸡狗猪]/g) || []);
            // 数字：取 1~2 位数字段（点号/顿号分隔列表如 05.12.33 也逐个提取；3 位及以上如期数/年份忽略）
            const numList = (str.match(/\d+/g) || []).filter(n => n.length <= 2);
            const zodSeen = new Set();
            const numSeen = new Set();
            let addedZod = 0, addedNum = 0;
            zodList.forEach(z => {
                if (!zodiacMap[z] || zodSeen.has(z)) return;
                zodSeen.add(z);
                parts.push({ cat: isKill ? 'frozen' : 'numbers', label: isKill ? '杀肖' : '选肖', value: z, display: z, kind: 'zodiac' });
                addedZod++;
            });
            numList.forEach(n => {
                const numInt = parseInt(n, 10);
                if (isNaN(numInt) || numInt < 1 || numInt > 49) return;
                const v = numInt.toString().padStart(2, '0');
                if (numSeen.has(v)) return;
                numSeen.add(v);
                parts.push({ cat: isKill ? 'frozen' : 'numbers', label: isKill ? '杀码' : '特码', value: v, display: v, kind: 'num' });
                addedNum++;
            });
            if (addedZod || addedNum) {
                const markText = zodList.filter(z => zodiacMap[z]).join('') + (addedNum ? (zodList.length ? ' ' : '') + numList.join(',') : '');
                hits.push("<span style='color:" + (isKill ? '#ef4444' : '#10b981') + ";'>" + (isKill ? '杀(标记):' : '选入(标记):') + "</span> " + markText);
            }
            parts.forEach(p => { if (p.checked === undefined) p.checked = true; });
            return { parts: parts, hits: hits };
        }

        // 规则1：死杀/绝杀生肖（兼容【】〖〗与『』；内容非生肖（如“更新中”）不计入）
        const killMatch = str.match(/(?:绝杀|死杀).*?肖\s*[〖【『]([^〗】』]*)[〗】』]/);
        if (killMatch) {
            const zods = killMatch[1].split('');
            let added = 0;
            zods.forEach(z => { if (zodiacMap[z]) { parts.push({ cat: 'frozen', label: '杀肖', value: z, display: z, kind: 'zodiac' }); added++; } });
            if (added) hits.push("<span style='color:#ef4444;'>杀肖:</span> " + killMatch[1]);
        }

        // 规则2：选肖（兼容生肖间用点号/顿号/空格分隔）
        const selectMatch = str.match(/(?:⑧|九|[八九])肖\s*((?:[鼠牛虎兔龙蛇马羊猴鸡狗猪][.、\s]*)+)/);
        if (selectMatch) {
            const zods = selectMatch[1].replace(/[.、\s]/g, '').split('');
            zods.forEach(z => { if (zodiacMap[z]) parts.push({ cat: 'numbers', label: '选肖', value: z, display: z, kind: 'zodiac' }); });
            hits.push("<span style='color:#10b981;'>选肖:</span> " + selectMatch[1]);
        }

        // 规则3：特码
        const numsMatch = str.match(/(?:⑩|十)码\s*([\d\.]+)/);
        if (numsMatch) {
            const validNums = [];
            numsMatch[1].split(/[\.\s]+/).forEach(n => {
                const numInt = parseInt(n);
                if (!isNaN(numInt) && numInt >= 1 && numInt <= 49) {
                    const formatNum = numInt.toString().padStart(2, '0');
                    parts.push({ cat: 'numbers', label: '特码', value: formatNum, display: formatNum, kind: 'num' });
                    validNums.push(formatNum);
                }
            });
            if (validNums.length > 0) hits.push("<span style='color:#10b981;'>特码:</span> " + validNums.join(','));
        }

        // 规则3.5：绝杀N码（杀码冻结）如“绝杀10码【27.36.12.06.45.03.18.21.30.32】”
        const killNumsMatch = str.match(/(?:绝杀|死杀|必杀)\s*(?:⑩|十|\d{1,2})\s*码\s*[:：]?\s*[〖【]([^〗】]*)[〗】]/);
        if (killNumsMatch) {
            const validNums = [];
            killNumsMatch[1].split(/[\.\s、]+/).forEach(n => {
                const numInt = parseInt(n, 10);
                if (!isNaN(numInt) && numInt >= 1 && numInt <= 49) {
                    const formatNum = numInt.toString().padStart(2, '0');
                    parts.push({ cat: 'frozen', label: '杀码', value: formatNum, display: formatNum, kind: 'num' });
                    validNums.push(formatNum);
                }
            });
            if (validNums.length > 0) hits.push("<span style='color:#ef4444;'>杀码:</span> " + validNums.join(','));
        }

        // 规则4：头数
        const headMatch = str.match(/([0-9\.]+)头/);
        if (headMatch) {
            headMatch[1].split('.').forEach(h => { if (h !== '') parts.push({ cat: 'firstDigit', label: '头数', value: h, display: h, kind: 'digit' }); });
            hits.push("<span style='color:#3b82f6;'>头数:</span> " + headMatch[1]);
        }

        // 规则5：五行（只认真实五行字符，占位内容如“更新中”不计入）
        const elementMatch = str.match(/三行中特\s*【(.*?)】/);
        if (elementMatch) {
            let added = 0;
            elementMatch[1].split('').forEach(e => {
                if ('金木水火土'.includes(e)) { parts.push({ cat: 'element', label: '五行', value: e, display: e, kind: 'char' }); added++; }
            });
            if (added) hits.push("<span style='color:#f59e0b;'>五行:</span> " + elementMatch[1]);
        }

        // 规则6：波色（兼容《》/【】括号，支持括号内多个颜色如“【红波+绿波】”；内幕波色由规则8处理）
        // 加号合集括号（【红波+蓝波】）由规则9.5展开为号码并集，此处跳过，避免颜色类别重复贡献
        if (!/内幕波色/.test(str)) {
            const colorRegex = /[《【]([^》】]*)[》】]/g;
            let colorMatch;
            const colors = new Set();
            while ((colorMatch = colorRegex.exec(str)) !== null) {
                if (inPlusBracket(colorMatch.index)) continue;
                if (!/波/.test(colorMatch[1])) continue;
                (colorMatch[1].match(/[红蓝绿]/g) || []).forEach(c => colors.add(c));
            }
            if (colors.size > 0) {
                colors.forEach(c => parts.push({ cat: 'color', label: '波色', value: c, display: c + '波', kind: 'colorChar' }));
                hits.push("<span style='color:#8b5cf6;'>波色:</span> " + Array.from(colors).join(''));
            }
        }

        // 规则7：风雨雷电 / 春夏秋冬 / 琴棋书画（类别词引导，取关键字后紧跟的组字）
        // 兼容旧格式 风雨雷电『风雨』，也支持 风雨雷电：风雨、风雨雷电【风雨】 等写法；
        // 占位内容如“？？？”不计入；合集括号（【风+雨】）内的字由规则9.5统一展开，此处跳过
        const groupKeywordRules = [
            { keyword: '风雨雷电', cat: 'weather', label: '风雨雷电', chars: { '风': 'wind', '雨': 'rain', '雷': 'thunder', '电': 'electric' } },
            { keyword: '春夏秋冬', cat: 'season', label: '春夏秋冬', chars: { '春': 'spring', '夏': 'summer', '秋': 'autumn', '冬': 'winter' } },
            { keyword: '四季', cat: 'season', label: '春夏秋冬', chars: { '春': 'spring', '夏': 'summer', '秋': 'autumn', '冬': 'winter' } },
            { keyword: '琴棋书画', cat: 'art', label: '琴棋书画', chars: { '琴': 'qin', '棋': 'qi', '书': 'shu', '画': 'hua' } }
        ];
        const groupHitTexts = [];
        groupKeywordRules.forEach(gr => {
            let gIdx = 0;
            while ((gIdx = str.indexOf(gr.keyword, gIdx)) > -1) {
                if (inPlusBracket(gIdx)) { gIdx += gr.keyword.length; continue; } // 关键字在合集括号内时由规则9.5处理
                const after = str.slice(gIdx + gr.keyword.length, gIdx + gr.keyword.length + 16);
                const found = [];
                const gSeen = new Set();
                Array.from(after).forEach((ch, ci) => {
                    if (!gr.chars[ch] || gSeen.has(ch)) return;
                    if (inPlusBracket(gIdx + gr.keyword.length + ci)) return; // 合集括号内由规则9.5处理
                    gSeen.add(ch);
                    found.push(ch);
                });
                if (found.length) {
                    found.forEach(ch => {
                        const key = gr.cat + ':' + gr.chars[ch];
                        if (!seenEffectKeys.has(key)) {
                            seenEffectKeys.add(key);
                            parts.push({ cat: gr.cat, label: gr.label, value: gr.chars[ch], display: ch, kind: 'effect' });
                            groupHitTexts.push(gr.label + '·' + ch);
                        }
                    });
                }
                gIdx += gr.keyword.length;
            }
        });
        if (groupHitTexts.length) hits.push("<span style='color:#0d9488;'>筛选:</span> " + groupHitTexts.join('、'));

        // 规则8：内幕波色（分位单双）如“内幕波色《红波》蓝双”或“内幕波色 〖红波+蓝双〗” → 红波单+红波双+蓝波双
        const nmbsIdx = str.indexOf('内幕波色');
        if (nmbsIdx > -1) {
            const seg = str.slice(nmbsIdx, nmbsIdx + 30);
            const waveColors = (seg.match(/([红蓝绿])波/g) || []).map(m => m.charAt(0));
            const sdMatches = seg.match(/([红蓝绿])?(单|双)/g) || [];
            if (waveColors.length) {
                const effSet = new Set();
                waveColors.forEach(c => { effSet.add(c + "波单"); effSet.add(c + "波双"); });
                const lastSd = sdMatches[sdMatches.length - 1];
                const sdM = lastSd ? lastSd.match(/([红蓝绿])?(单|双)/) : null;
                if (sdM && sdM[1]) effSet.add(sdM[1] + "波" + sdM[2]);
                effSet.forEach(eff => parts.push({ cat: 'color', label: '内幕波色', value: eff, display: eff, kind: 'effect' }));
                hits.push("<span style='color:#8b5cf6;'>内幕波色:</span> " + seg.replace(/\s+/g, ' ').trim());
            }
        }

        // 规则9：尾数（六尾⑱码等）如“六尾 1.4.5.6.7.9尾”或“六尾【124679尾】”
        const tailMatch = str.match(/(?:六尾|尾数)\s*[:：]?\s*(?:[〖【]([^〗】]*)[〗】]|([\d\.]+))/);
        if (tailMatch) {
            const bracketContent = tailMatch[1];
            const tailTokens = bracketContent !== undefined
                ? (bracketContent.match(/\d/g) || [])
                : tailMatch[2].split('.');
            tailTokens.forEach(t => { if (t !== '') parts.push({ cat: 'lastDigit', label: '尾数', value: t, display: t, kind: 'digit' }); });
            hits.push("<span style='color:#0891b2;'>尾数:</span> " + (bracketContent !== undefined ? bracketContent : tailMatch[2]));
        }

        // 规则9.4：杀尾（绝杀二尾/死杀尾等）如 绝杀二尾【7尾.5尾】 → 冻结对应尾数
        const killTailMatch = str.match(/(?:绝杀|死杀|必杀).*?尾\s*[〖【]?([^〗】]*)/);
        if (killTailMatch) {
            const tailStr = killTailMatch[1].replace(/[^\d.]+/g, '.');
            const killTails = tailStr.split('.').filter(t => /^\d$/.test(t));
            if (killTails.length) {
                killTails.forEach(t => parts.push({ cat: 'frozen', label: '杀尾', value: t, display: t + '尾', kind: 'digit' }));
                hits.push("<span style='color:#ef4444;'>杀尾:</span> " + killTails.join(','));
            }
        }

        // 规则9.5：加号合集组合（【A+B+C】），如 【单数+羊鸡】【家禽+鼠龙】【男肖+羊蛇】
        // 每项展开为具体号码并入 numbers（并集），避免交集筛选冲突（如 男肖∩羊蛇=空）；
        // 兼容原有“男女中特【男肖+羊蛇】”语义；仅含加号的括号才识别，“更新中”等普通括号不触发；
        // 命中后跳过规则10，避免后面的 "女肖：… 男肖:…" 分组说明被当成选入
        let comboFired = false;
        plusBracketRanges.forEach(range => {
            const content = str.slice(range.start + 1, range.end - 1);
            if (/杀|禁|死/.test(content)) return;
            const preText = str.slice(Math.max(0, range.start - 6), range.start);
            if (/杀|禁|死/.test(preText)) return;
            const tokens = content.split(/[+＋]/).map(s => s.replace(/[.、\s]/g, '')).filter(Boolean);
            let addedAny = false;
            const comboLabel = /男肖|女肖/.test(content) ? '男女中特' : '合集';
            const comboSeen = new Set();
            tokens.forEach(tok => {
                const nums = expandComboToken(tok);
                if (!nums || !nums.length) return;
                // 生肖串按单个生肖拆分 chips；其余词条整项一个 chip（记录号码集合，避免 chips 爆炸）
                const allZodiac = tok.length > 0 && Array.from(tok).every(ch => zodiacMap[ch]);
                if (allZodiac) {
                    Array.from(tok).forEach(z => {
                        if (!zodiacMap[z] || comboSeen.has('z:' + z)) return;
                        comboSeen.add('z:' + z);
                        parts.push({ cat: 'numbers', label: comboLabel, value: z, display: z, kind: 'zodiac' });
                    });
                } else {
                    if (comboSeen.has('n:' + tok)) return;
                    comboSeen.add('n:' + tok);
                    parts.push({ cat: 'numbers', label: comboLabel, value: tok, display: tok, kind: 'numset', nums: nums.slice() });
                }
                addedAny = true;
            });
            if (addedAny) {
                comboFired = true;
                hits.push("<span style='color:#0d9488;'>" + comboLabel + ":</span> " + content);
            }
        });

        // 规则9.6：特码筛选器类别词条（大数/小数/单数/双数/合数单/合数双/家禽/野兽/阳肖/阴肖/男肖/女肖）
        // 成对连写（如“大数小数”“男肖女肖”“阴阳肖”“合数单双”）视为栏目表头跳过，避免误选；
        // 合集括号内的词条由规则9.5展开，此处跳过；男肖/女肖后跟生肖列表的由规则10处理，此处跳过
        const filterWordRules = [
            { word: '合数单', cat: 'compositeOddEven', value: 'compositeOdd', label: '合数单双', pairs: ['合数双', '双'] },
            { word: '合数双', cat: 'compositeOddEven', value: 'compositeEven', label: '合数单双', pairs: ['合数单', '单'] },
            { word: '家禽', cat: 'animalType', value: 'poultry', label: '家禽野兽', pairs: ['野兽'] },
            { word: '野兽', cat: 'animalType', value: 'beast', label: '家禽野兽', pairs: ['家禽'] },
            { word: '男肖', cat: 'genderZodiac', value: 'male', label: '男肖女肖', pairs: ['女肖'] },
            { word: '女肖', cat: 'genderZodiac', value: 'female', label: '男肖女肖', pairs: ['男肖'] },
            { word: '阳肖', cat: 'yinYangZodiac', value: 'yang', label: '阴阳生肖', pairs: ['阴肖', '阴'] },
            { word: '阴肖', cat: 'yinYangZodiac', value: 'yin', label: '阴阳生肖', pairs: ['阳肖', '阳'] },
            { word: '大数', cat: 'size', value: 'big', label: '特码大小', pairs: ['小数', '小'] },
            { word: '小数', cat: 'size', value: 'small', label: '特码大小', pairs: ['大数', '大'] },
            { word: '单数', cat: 'oddEven', value: 'odd', label: '特码单双', pairs: ['双数', '双'] },
            { word: '双数', cat: 'oddEven', value: 'even', label: '特码单双', pairs: ['单数', '单'] }
        ];
        const filterHits = [];
        filterWordRules.forEach(rule => {
            let fIdx = 0;
            while ((fIdx = str.indexOf(rule.word, fIdx)) > -1) {
                if (!inPlusBracket(fIdx)) {
                    const before = str.slice(Math.max(0, fIdx - 2), fIdx);
                    const after = str.slice(fIdx + rule.word.length, fIdx + rule.word.length + 2);
                    const pairAdjacent = rule.pairs.some(p => before.endsWith(p) || after.startsWith(p));
                    const followedByZodiacList = rule.cat === 'genderZodiac' && /^[:：]?\s*[鼠牛虎兔龙蛇马羊猴鸡狗猪]/.test(after);
                    if (!pairAdjacent && !followedByZodiacList) {
                        const key = rule.cat + ':' + rule.value;
                        if (!seenEffectKeys.has(key)) {
                            seenEffectKeys.add(key);
                            parts.push({ cat: rule.cat, label: rule.label, value: rule.value, display: rule.word, kind: 'effect' });
                            filterHits.push(rule.label + '·' + rule.word);
                        }
                    }
                }
                fIdx += rule.word.length;
            }
        });
        if (filterHits.length) hits.push("<span style='color:#0d9488;'>筛选:</span> " + filterHits.join('、'));

        // 规则9.7：类别词引导的单字（“大小：大”“单双：单数”等；合数单双栏目名不触发特码单双）
        const singleCharGuides = [
            { re: /大小\s*[:：]?\s*([大小]+)/, cat: 'size', label: '特码大小', map: { '大': 'big', '小': 'small' } },
            { re: /单双\s*[:：]?\s*([单双]+)/, cat: 'oddEven', label: '特码单双', map: { '单': 'odd', '双': 'even' } }
        ];
        singleCharGuides.forEach(g => {
            const gm = str.match(g.re);
            if (!gm) return;
            const prev2 = str.slice(Math.max(0, gm.index - 2), gm.index);
            if (/合数/.test(prev2)) return; // “合数单双：…”不当作特码单双
            Array.from(gm[1]).forEach(ch => {
                const v = g.map[ch];
                if (!v) return;
                const key = g.cat + ':' + v;
                if (!seenEffectKeys.has(key)) {
                    seenEffectKeys.add(key);
                    parts.push({ cat: g.cat, label: g.label, value: v, display: ch, kind: 'effect' });
                    filterHits.push(g.label + '·' + ch);
                }
            });
        });

        // 规则10：男肖/女肖（兼容点号/顿号/空格分隔）；合集括号规则已命中则跳过，避免分组说明被误选入
        if (!comboFired) {
            const genderRe = /(男肖|女肖)\s*[:：]?\s*((?:[鼠牛虎兔龙蛇马羊猴鸡狗猪][.、\s]*)+)/g;
            let gm;
            while ((gm = genderRe.exec(str)) !== null) {
                const gkey = gm[1] === '男肖' ? 'male' : 'female';
                const zods = gm[2].replace(/[.、\s]/g, '');
                if (zods.length) parts.push({ cat: 'genderZodiac', label: '男肖/女肖', value: gkey, display: gm[1], kind: 'effect' });
                hits.push("<span style='color:#0d9488;'>男肖/女肖:</span> " + gm[1] + ' ' + zods);
            }
        }

        // 规则11：标题兜底解析（正文缺类型词但标题有，如“【兄弟九肖】”“【疯狂尾数】”）
        if (!hits.length && title) {
            const t = String(title);
            // 选肖兜底：标题含 九肖/八肖/⑧肖 且非杀肖类 → 从正文取生肖串。
            // 优先取括号内生肖串（【兔狗…】）；无括号时兼容「N期:兔狗蛇猪…」这种正文只有列表的写法
            // （群英会一肖一码·九肖 提取条目），避免 九肖 解析为空
            if (/(?:九|八|⑧|兄弟)肖/.test(t) && !/(?:绝杀|死杀|杀肖|禁)/.test(t)) {
                const zm2 = str.match(/[〖【]([鼠牛虎兔龙蛇马羊猴鸡狗猪]+)[〗】]/)
                    || str.match(/(?:^|[^\d])\d{1,3}\s*期\s*[:：]?\s*([鼠牛虎兔龙蛇马羊猴鸡狗猪]{2,})/);
                if (zm2) {
                    let added = 0;
                    Array.from(zm2[1]).forEach(z => { if (zodiacMap[z]) { parts.push({ cat: 'numbers', label: '选肖', value: z, display: z, kind: 'zodiac' }); added++; } });
                    if (added) hits.push("<span style='color:#10b981;'>选肖(标题):</span> " + zm2[1]);
                }
            }
            // 尾数兜底：标题含“尾数” → 从正文提取 数字.数字…尾
            if (/尾数/.test(t)) {
                const tm2 = str.match(/([\d\.]+)\s*尾/);
                if (tm2) {
                    tm2[1].split('.').forEach(x => { if (x !== '') parts.push({ cat: 'lastDigit', label: '尾数', value: x, display: x, kind: 'digit' }); });
                    hits.push("<span style='color:#0891b2;'>尾数(标题):</span> " + tm2[1]);
                }
            }
        }

        // 汇总去重：同一 类别+标签+值 的子选项只保留一个（效果集合本身会去重，这里避免重复 chips）
        const seenPartKeys = new Set();
        const dedupParts = [];
        parts.forEach(p => {
            const key = p.cat + '|' + p.label + '|' + p.value;
            if (seenPartKeys.has(key)) return;
            seenPartKeys.add(key);
            dedupParts.push(p);
        });
        parts.length = 0;
        dedupParts.forEach(p => parts.push(p));

        parts.forEach(p => { if (p.checked === undefined) p.checked = true; });
        return { parts: parts, hits: hits };
    }

    // 由勾选的子选项汇总该条策略的贡献（规则语义与原实现一致：选肖/男女中特展开为具体号码，杀肖/男肖女肖等按组）
    function buildItemEffects(parts) {
        const effects = emptyImportAgg();
        parts.forEach(p => {
            if (p.checked === false) return;
            if (p.kind === 'zodiac') {
                if (p.cat === 'frozen') effects.frozen.add('zodiac:' + p.value);
                else if (zodiacMap[p.value]) zodiacMap[p.value].forEach(n => effects.numbers.add(n));
            } else if (p.kind === 'num') {
                if (p.cat === 'frozen') effects.frozen.add('num:' + p.value);
                else effects.numbers.add(p.value);
            } else if (p.kind === 'digit') {
                if (p.cat === 'frozen') effects.frozen.add('lastDigit:' + p.value); // 杀尾：冻结对应尾数
                else if (p.cat === 'lastDigit') effects.lastDigit.add(p.value);
                else effects.firstDigit.add(p.value);
            } else if (p.kind === 'char') {
                if (p.cat === 'weather') effects.weather.add(p.value);
                else effects.element.add(p.value);
            } else if (p.kind === 'colorChar') {
                effects.color.add(p.value + '波单');
                effects.color.add(p.value + '波双');
            } else if (p.kind === 'numset') {
                // 加号合集展开的号码集合：直接并入 numbers（并集语义）
                (p.nums || []).forEach(n => effects.numbers.add(n));
            } else if (p.kind === 'effect') {
                if (p.cat === 'color') effects.color.add(p.value);
                else if (p.cat === 'weather') effects.weather.add(p.value);
                else if (p.cat === 'genderZodiac') effects.genderZodiac.add(p.value);
                else if (p.cat === 'lastDigit') effects.lastDigit.add(p.value);
                else if (p.cat === 'firstDigit') effects.firstDigit.add(p.value);
                else if (p.cat === 'size') effects.size.add(p.value);
                else if (p.cat === 'oddEven') effects.oddEven.add(p.value);
                else if (p.cat === 'compositeOddEven') effects.compositeOddEven.add(p.value);
                else if (p.cat === 'animalType') effects.animalType.add(p.value);
                else if (p.cat === 'yinYangZodiac') effects.yinYangZodiac.add(p.value);
                else if (p.cat === 'season') effects.season.add(p.value);
                else if (p.cat === 'art') effects.art.add(p.value);
            }
        });
        return effects;
    }

    // 刷新所有按钮的冻结样式
    function refreshFrozenClasses() {
        document.querySelectorAll('.btn').forEach(btn => btn.classList.remove('frozen'));
        Array.from(frozenItems).forEach(itemKey => {
            const [cat, val] = itemKey.split(':');
            const btn = document.querySelector(`.btn[data-category="${cat}"][data-value="${val}"]`);
            if (btn) btn.classList.add('frozen');
        });
    }

    // 根据勾选状态重算导入贡献，并同步到页面状态（保留手动选择）
    // 聚合规则：选入类规则在勾选策略间取交集，并与手动选择取交集（由 updateDisplay 应用）；冻结/杀肖类规则取并集
    function syncImportState() {
        const newAgg = emptyImportAgg();
        const activeCat = window.__importActiveCat;
        // 类别过滤：选择了「新澳门条目/香港条目」时，仅该类别的勾选条目参与聚合
        const checkedItems = (window.__importedStrategies || []).filter(it => it.checked && (!activeCat || it.lottery === activeCat));
        // 选入类规则 = 交集，冻结/杀肖类规则 = 并集
        IMPORT_CATS.forEach(cat => {
            if (cat === 'frozen') {
                // 并集：任何一条勾选策略冻结/杀肖的都生效
                checkedItems.forEach(it => it.effects[cat].forEach(v => newAgg[cat].add(v)));
            } else {
                // 交集：仅在提供了该类别规则（集合非空）的勾选策略间取交集；未写该规则的策略视为无约束
                const providers = checkedItems.filter(it => it.effects[cat].size > 0);
                if (!providers.length) return;
                providers[0].effects[cat].forEach(v => newAgg[cat].add(v));
                for (let i = 1; i < providers.length; i++) {
                    const keep = newAgg[cat];
                    newAgg[cat] = new Set();
                    providers[i].effects[cat].forEach(v => { if (keep.has(v)) newAgg[cat].add(v); });
                }
            }
        });
        const oldAgg = window.__importedAgg || emptyImportAgg();
        // 冻结/杀肖类规则：并集，继续差分同步到 frozenItems
        oldAgg.frozen.forEach(v => { if (!newAgg.frozen.has(v)) frozenItems.delete(v); });
        newAgg.frozen.forEach(v => { if (!oldAgg.frozen.has(v)) frozenItems.add(v); });
        // 选入类规则（numbers/firstDigit/color/element/weather/lastDigit/genderZodiac）：
        // 不再并入 selectedOptions，保留在 __importedAgg 作为独立约束，
        // 由 updateDisplay 与手动选择取交集（任一侧为空则该类不约束）。
        window.__importedAgg = newAgg;
        refreshFrozenClasses();
        if (typeof syncUI === 'function') syncUI();
        if (typeof updateDisplay === 'function') updateDisplay();
    }

    // v1.90：当期开奖命中判断——子选项的值（生肖/号码/头数/尾数/波色/五行/类别组合…）落在开奖特码对应集合即命中；
    // 尾数/头数/波色特判，其余复用 expandComboToken 的「类别/词条 → 号码集合」映射（与期数弹窗 tipValueMatched 同一套规则）。
    function partHitDraw(p, tm, color) {
        const tmStr = String(tm == null ? '' : tm);
        if (!tmStr) return false;
        const label = String(p.label || '');
        const v = String(p.display == null ? '' : p.display);
        if (/尾数/.test(label)) return v.replace(/尾$/, '') === tmStr.slice(-1);
        if (/头数/.test(label)) return v === tmStr.charAt(0);
        if (/波色/.test(label)) return !!color && v.indexOf(color) > -1;
        if (p.kind === 'numset') return Array.isArray(p.nums) && p.nums.indexOf(tmStr) > -1;
        // 统一按显示文本匹配（与期数弹窗 tipValueMatched 一致）：生肖/号码/五行/大小/单双/男肖女肖等
        // 均由 expandComboToken 展开为号码集合，特码落在集合内即命中
        const nums = (typeof expandComboToken === 'function') ? expandComboToken(v) : null;
        return Array.isArray(nums) && nums.length > 0 && nums.indexOf(tmStr) > -1;
    }

    // 渲染单条条目内可按类别点击启用的子选项（直接点击选项切换，不显示勾选框）
    // v1.90：子条目行左对齐条目勾选框；开奖数据到达后（23:59 清空子条目之前）——
    // 选入类命中当期开奖的子选项标浅红；杀肖/杀码/杀尾等冻结类：整组杀对（当期开奖未开出
    // 组内任何冻结值，如冻结牛羊开马肖）→ 在标签词（如「杀肖」）与冒号之间显示一个浅红底
    // 红字「中」小标签（杀肖 中: 牛 羊），chip 一律保持原样；杀错/部分杀错 → chip 保持原样、不做任何标记。
    function renderItemParts(itemIndex, it) {
        const parts = it.parts || [];
        if (!parts.length) return '<div class="zdr-import-part-line" style="margin:2px 0 0 0;color:#94a3b8;line-height:1.7;">（请先获取数据）</div>';
        // 查找该条目当前期数的开奖记录：当期未开奖（无记录）则不标红
        let drawHit = null;
        const period = extractItemPeriod(it);
        if (period != null && typeof findDrawRecordByPeriod === 'function' && typeof getTmFromRecord === 'function') {
            const rec = findDrawRecordByPeriod(it.lottery, period);
            if (rec) {
                const tm = getTmFromRecord(rec);
                if (tm) {
                    const color = redNums.indexOf(tm) > -1 ? '红' : (blueNums.indexOf(tm) > -1 ? '蓝' : (greenNums.indexOf(tm) > -1 ? '绿' : ''));
                    drawHit = { tm: tm, color: color };
                }
            }
        }
        const activeCat = window.__importActiveCat;
        const locked = !!activeCat && it.lottery !== activeCat; // 已选类别时另一类条目不可选
        const groups = [];
        const groupMap = {};
        parts.forEach((p, pi) => {
            if (!groupMap[p.label]) { groupMap[p.label] = []; groups.push({ label: p.label, list: groupMap[p.label] }); }
            groupMap[p.label].push(pi);
        });
        const chipBase = 'display:inline-block;border-radius:10px;cursor:pointer;margin:2px 4px 0 0;user-select:none;transition:background .15s;';
        return groups.map(g => {
            // 冻结类整组杀对判定：组内全部为冻结类且当期开奖未开出组内任何值
            const allKill = g.list.length > 0 && g.list.every(pi => parts[pi].cat === 'frozen');
            const groupKillCorrect = allKill && !!drawHit && !g.list.some(pi => partHitDraw(parts[pi], drawHit.tm, drawHit.color));
            return '<div class="zdr-import-part-line" style="margin:2px 0 0 0;color:#64748b;line-height:1.7;">' + escHtml(g.label) +
                // 整组杀对时「中」标签放在标签词与冒号之间（杀肖 中: 牛 羊）
                (groupKillCorrect ? ' <span class="zdr-import-hit-badge"' + (locked ? ' style="opacity:.8;"' : '') + '>中</span>' : '') +
                ': ' +
                g.list.map(pi => {
                    const p = parts[pi];
                    const on = it.checked && p.checked;
                    const hit = !!drawHit && partHitDraw(p, drawHit.tm, drawHit.color);
                    const isKill = p.cat === 'frozen'; // 杀肖/杀码/杀尾等冻结类：chip 永远保持原样
                    const style = chipBase + (hit && !isKill
                        ? 'background:#f87171;color:#fff;font-weight:600;' + (locked ? 'cursor:not-allowed;opacity:.8;' : '')
                        : (locked ? 'background:#f1f5f9;color:#cbd5e1;cursor:not-allowed;opacity:.6;' : (on ? 'background:#f59e0b;color:#fff;font-weight:600;' : 'background:#e2e8f0;color:#94a3b8;')));
                    const tip = locked ? '已选择另一类别，不可操作' : (hit ? (isKill ? '该冻结项被开出（杀错）' : '该选项命中当期开奖') : (isKill ? '该冻结项未开出（杀对）' : '点击启用/停用'));
                    return '<span class="zdr-import-chip"' + (locked ? '' : ' onclick="window.toggleImportPart(' + itemIndex + ',' + pi + ')"') + ' title="' + tip + '" style="' + style + '">' + escHtml(p.display) + '</span>';
                }).join('') +
                '</div>';
        }).join('');
    }

    // v1.90：历史存储最多 30 期，最新期在右侧。PC 端不限制每排 10 个——全部期数直接显示、
    // 只有一排放不下才自动折行；一旦发生换行就显示「▴ 收起」折叠提示（收起后单行显示并变为
    // 「▾ 查看全部 N 期」，再点恢复），一排放得下时不显示提示；移动端沿用 10 列网格，
    // 超过 10 期时显示「查看全部 N 期」展开按钮。中=浅红底白字、不中=浅灰底白字。
    const __expandedHistoryKeys = new Set();
    const __desktopCollapsedKeys = new Set(); // 桌面端「收起」状态（仅当换行时可用）
    window.toggleImportHistoryExpanded = function(itemIndex) {
        const items = window.__importedStrategies;
        if (!items || !items[itemIndex]) return;
        const key = importHistoryKey(items[itemIndex]);
        if (__expandedHistoryKeys.has(key)) __expandedHistoryKeys.delete(key);
        else __expandedHistoryKeys.add(key);
        if (typeof renderImportList === 'function') renderImportList();
    };
    window.toggleDesktopHistoryCollapse = function(itemIndex) {
        const items = window.__importedStrategies;
        if (!items || !items[itemIndex]) return;
        const key = importHistoryKey(items[itemIndex]);
        if (__desktopCollapsedKeys.has(key)) __desktopCollapsedKeys.delete(key);
        else __desktopCollapsedKeys.add(key);
        if (typeof renderImportList === 'function') renderImportList();
    };
    function renderImportHistory(itemIndex, it, histMap) {
        if (extractItemPeriod(it) == null) return ''; // 无期数，无法一一对应，不渲染第三排
        const key = importHistoryKey(it);
        const h = histMap[key];
        const periods = (h && Array.isArray(h.periods)) ? h.periods : [];
        if (!periods.length) {
            // 无战绩时区分“页面还没有任何开奖数据”与“该期数据缺失”：Kiwi 等无油猴直连的环境下
            // 需先加载开奖数据（新澳门/香港特码页或插件穿透）历史才会补记
            const noData = typeof hasAnyLotteryData === 'function' && !hasAnyLotteryData();
            return '<div class="zdr-import-hint" style="margin:2px 0 0 21px;color:#94a3b8;line-height:1.7;">' + (noData ? '暂无开奖数据 · 需先加载开奖数据（新澳门/香港特码页）' : '该期暂无开奖数据（可能未开奖）') + '</div>';
        }
        // v1.86：电脑端（hover+精细指针）绑定悬停显示/移开即关，并支持点击立即显示；
        // 移动端只绑定点击切换（不绑 hover，避免触屏合成 mouseenter 干扰）；点击空白处由全局监听关闭
        const hoverAttrs = __periodTipHoverCapable
            ? ' onmouseenter="window.showPeriodTooltip(event, this)" onmouseleave="window.hidePeriodTooltip()"'
            : '';
        const expanded = __expandedHistoryKeys.has(key);
        const isMobile = window.innerWidth <= 600; // 与移动端 CSS 断点一致
        const desktopCollapsed = !isMobile && __desktopCollapsedKeys.has(key);
        const shown = (!isMobile || expanded) ? periods : periods.slice(-10);
        // 移动端：10 列网格 + 超过 10 期显示「查看全部/收起」；桌面端：折叠提示是否显示由
        // 渲染后的换行/裁剪测量决定（见 syncDesktopHistoryHint），文案按收起状态切换
        let toggle = '';
        if (isMobile && periods.length > 10) {
            toggle = '<div class="zdr-import-history-toggle" onclick="window.toggleImportHistoryExpanded(' + itemIndex + ')">' + (expanded ? '▴ 收起' : '▾ 查看全部 ' + periods.length + ' 期') + '</div>';
        } else if (!isMobile) {
            toggle = '<div class="zdr-import-history-toggle" data-desktop="1" onclick="window.toggleDesktopHistoryCollapse(' + itemIndex + ')">' + (desktopCollapsed ? '▾ 查看全部 ' + periods.length + ' 期' : '▴ 收起') + '</div>';
        }
        // v1.90：期数改为浅红底白字（中）/ 浅灰底白字（不中），去掉边框
        return '<div class="zdr-import-history-row' + (expanded ? ' zdr-expanded' : '') + (desktopCollapsed ? ' zdr-collapsed' : '') + '">' +
            shown.map(p => '<span class="zdr-import-period" style="background:' + (p.hit ? '#f87171' : '#9ca3af') + ';color:#fff;border-radius:6px;cursor:default;" data-qishu="' + escAttr(String(p.qishu)) + '" data-hit="' + (p.hit ? '1' : '0') + '" data-tip="' + escAttr(p.partsText || '') + '" data-tm="' + escAttr(p.tm || '') + '" data-sx="' + escAttr(p.sx || '') + '" data-wx="' + escAttr(p.wx || '') + '" data-color="' + escAttr(p.color || '') + '"' + hoverAttrs + ' onclick="window.togglePeriodTooltip(event, this)">' + escHtml(String(p.qishu)) + '</span>').join('') +
            '</div>' + toggle;
    }

    // v1.90：桌面端折叠提示——展开状态下发生换行（排不下）才显示「▴ 收起」；
    // 收起状态下发生裁剪（还有更多期数）才显示「▾ 查看全部 N 期」；一排放得下则隐藏
    function syncDesktopHistoryHint() {
        if (window.innerWidth <= 600) return;
        const rows = document.querySelectorAll('.zdr-import-history-row');
        for (let i = 0; i < rows.length; i++) {
            const row = rows[i];
            const toggle = row.nextElementSibling;
            if (!toggle || !toggle.classList || !toggle.classList.contains('zdr-import-history-toggle') || toggle.getAttribute('data-desktop') !== '1') continue;
            const collapsed = row.classList.contains('zdr-collapsed');
            let show = false;
            if (collapsed) {
                show = row.scrollWidth > row.clientWidth + 1; // 单行裁剪说明还有更多期数
            } else {
                const first = row.firstElementChild;
                const last = row.lastElementChild;
                show = !!(first && last && first.offsetTop !== last.offsetTop); // 换行说明排不下
            }
            toggle.style.display = show ? '' : 'none';
        }
    }
    // v1.90：窗口缩放时即时刷新桌面端折叠提示；跨移动/桌面断点（600px）时重新渲染以切换期数显示逻辑
    let __lastWidthBreak = window.innerWidth <= 600;
    if (typeof window.addEventListener === 'function') {
        window.addEventListener('resize', function() {
            const nowMobile = window.innerWidth <= 600;
            if (nowMobile !== __lastWidthBreak) {
                __lastWidthBreak = nowMobile;
                if (typeof renderImportList === 'function') renderImportList();
            } else if (typeof syncDesktopHistoryHint === 'function') {
                syncDesktopHistoryHint();
            }
        });
    }

    // 渲染导入条目清单（条目级勾选保留；条目内子选项直接点击切换）
    // 按网站识别导入条目来源（用于分组显示；群英会旧标题可能只带 599507.com/599508.com 域名）
    function detectImportSite(it) {
        const t = String(it && it.title || '');
        if (/奥霸网|澳霸网/.test(t)) return '奥霸网';
        if (/铁算盘/.test(t)) return '铁算盘';
        if (/九龙网|九龍网/.test(t)) return '澳门九龙网';
        if (/群英会/.test(t) || /599507\.com|599508\.com/.test(t)) return '群英会';
        return '其他';
    }
    function siteHeadColor(site) {
        return site === '铁算盘' ? '#0e7490'
            : site === '澳门九龙网' ? '#1d4ed8'
            : site === '群英会' ? '#059669'
            : site === '奥霸网' ? '#c2410c' : '#64748b';
    }

    // v1.62：按网站分组的低饱和底色（铁算盘浅青 / 澳门九龙网浅蓝 / 群英会浅绿 / 奥霸网浅橙 / 其他浅灰）
    const siteTheme = {
        '铁算盘':    { bg: '#e8f4f7', border: '#0e7490', text: '#155e75' },
        '澳门九龙网': { bg: '#eaf1fe', border: '#1d4ed8', text: '#1e40af' },
        '群英会':    { bg: '#e9f7f1', border: '#059669', text: '#047857' },
        '奥霸网':    { bg: '#fff3e6', border: '#c2410c', text: '#9a3412' },
        '其他':      { bg: '#f1f5f9', border: '#64748b', text: '#475569' }
    };

    function renderImportList() {
        const listEl = document.getElementById('ext-strategy-list');
        if (!listEl) return;
        const clearBtn = document.getElementById('ext-strategy-clear-btn');
        const items = window.__importedStrategies || [];
        const activeCat = window.__importActiveCat;
        if (!items.length) {
            listEl.innerHTML = '';
            if (clearBtn) clearBtn.style.display = 'none';
            updateToggleAllButton();
            renderCategoryButtons();
            return;
        }
        if (clearBtn) clearBtn.style.display = 'block';
        const badge = (it) => '<span class="zdr-import-badge" style="display:inline-block;margin-right:4px;border-radius:4px;' + (it.lottery === 'hk' ? 'background:#fee2e2;color:#b91c1c;' : 'background:#dbeafe;color:#1d4ed8;') + '">' + (it.lottery === 'hk' ? '香港' : '新澳门') + '</span>';
        // 类别筛选：选择了「新澳门/香港」时清单只显示该类别条目
        const visibleItems = activeCat ? items.filter(it => it.lottery === activeCat) : items;
        const catName = activeCat === 'hk' ? '香港' : (activeCat === 'macau' ? '新澳门' : '');
        if (clearBtn) clearBtn.textContent = activeCat ? '清空「' + catName + '」导入清单' : '清空导入清单';
        const headText = activeCat
            ? '<span style="color:' + (activeCat === 'hk' ? '#b91c1c' : '#1d4ed8') + ';">当前条目仅显示「' + catName + '」' + visibleItems.length + ' 条。</span>'
            : '已导入条目（共 ' + items.length + ' 条。）';
        const histMap = ensureImportHistories();
        // v1.62：置顶条目排在全部条目最上方（不分网站；上限 IMPORT_PIN_LIMIT 条）
        const totalPinned = items.filter(x => x.pinned).length;
        const pinned = visibleItems.filter(it => it.pinned);
        const rest = visibleItems.filter(it => !it.pinned);
        // 按网站分组：相同网站的条目集中显示（置顶条目已单独抽出，不重复展示）
        const siteOrder = ['铁算盘', '澳门九龙网', '群英会', '奥霸网', '其他'];
        const groups = {};
        rest.forEach(it => {
            const s = detectImportSite(it);
            (groups[s] = groups[s] || []).push(it);
        });
        const renderItem = (it) => {
            const realIndex = items.indexOf(it);
            return '<div class="zdr-import-item' + (it.pinned ? ' zdr-pinned' : '') + '" data-pin-index="' + realIndex + '" title="">' +
                '<label style="display:flex;align-items:flex-start;gap:6px;cursor:pointer;">' +
                '<input type="checkbox" ' + (it.checked ? 'checked' : '') + ' onchange="window.toggleImportItem(' + realIndex + ', this.checked)" style="flex-shrink:0;margin-top:2px;">' +
                '<span class="zdr-import-title" title="' + escAttr(it.latest_data || '') + '" style="' + (it.checked ? '' : 'color:#94a3b8;') + '">' + (it.pinned ? '<span class="zdr-import-pin-icon">📌</span>' : '') + badge(it) + escHtml(it.title) + '</span>' +
                '</label>' +
                renderItemParts(realIndex, it) +
                renderImportHistory(realIndex, it, histMap) +
                '</div>';
        };
        let listHtml = '<div class="zdr-import-head" style="margin:4px 0 2px;font-weight:600;">' + headText + '</div>';
        if (pinned.length) {
            listHtml += '<div class="zdr-import-pinned-group"><div class="zdr-import-pinned-head">📌 置顶（' + totalPinned + '/' + IMPORT_PIN_LIMIT + '）</div>' + pinned.map(renderItem).join('') + '</div>';
        }
        siteOrder.forEach(site => {
            const group = groups[site];
            if (!group || !group.length) return;
            const th = siteTheme[site] || siteTheme['其他'];
            listHtml += '<div class="zdr-import-site-group" style="background:' + th.bg + ';border:1px solid ' + th.bg + ';">' +
                '<div class="zdr-import-site-head" style="margin:2px 0 4px;font-weight:700;color:' + th.text + ';border-left:3px solid ' + th.border + ';padding-left:6px;">' + escHtml(site) + '（' + group.length + '）</div>' +
                group.map(renderItem).join('') +
                '</div>';
        });
        listEl.innerHTML = listHtml;
        syncDesktopHistoryHint();
        updateToggleAllButton();
        renderCategoryButtons();
    }
    window.renderImportList = renderImportList; // 供 IIFE 外部的 clearAllSelections 调用
    // 置顶反馈 toast（轻量浮层，不遮挡操作）
    function showPinToast(text) {
        let t = document.getElementById('zdr-pin-toast');
        if (!t) {
            t = document.createElement('div');
            t.id = 'zdr-pin-toast';
            t.className = 'zdr-pin-toast';
            document.body.appendChild(t);
        }
        t.textContent = text;
        t.classList.add('show');
        clearTimeout(t._tm);
        t._tm = setTimeout(function() { t.classList.remove('show'); }, 1600);
    }

    // 置顶/取消置顶（最多 IMPORT_PIN_LIMIT 条；置顶条目排在全部条目最上方）
    // v1.63：pinTo 显式指定 true=置顶 / false=取消置顶（长按改弹小菜单后由菜单按钮调用）
    window.toggleImportPin = function(index, pinTo) {
        const items = window.__importedStrategies;
        if (!items || !items[index]) return;
        const it = items[index];
        const activeCat = window.__importActiveCat;
        if (activeCat && it.lottery !== activeCat) return; // 已选类别时另一类条目不可操作
        pushZdrHistory();
        const totalPinned = items.filter(x => x.pinned).length;
        const want = pinTo === undefined ? !it.pinned : !!pinTo;
        if (want === !!it.pinned) return; // 目标状态已达成
        if (want && totalPinned >= IMPORT_PIN_LIMIT) {
            showPinToast('最多置顶 ' + IMPORT_PIN_LIMIT + ' 条，请先取消其他置顶');
            return;
        }
        it.pinned = want;
        saveImportedStrategies();
        renderImportList();
        showPinToast(want ? '已置顶（' + (totalPinned + 1) + '/' + IMPORT_PIN_LIMIT + '）' : '已取消置顶');
    };

    // v1.63：长按条目弹出的置顶小菜单（非全屏，锚定在条目旁，点空白处关闭）
    // 样式与「暂存号码」彩种选择小窗一致：横排两个彩色按钮（置顶橙 / 取消置顶灰）
    function showImportPinPicker(index, px, py) {
        hideImportPinPicker();
        const items = window.__importedStrategies;
        if (!items || !items[index]) return;
        const pop = document.createElement('div');
        pop.id = 'zdr-pin-picker';
        pop.style.cssText = 'position:fixed;z-index:99999;background:#ffffff;border:1px solid #e2e8f0;border-radius:10px;box-shadow:0 6px 18px rgba(0,0,0,0.15);padding:8px;display:flex;gap:6px;';
        // v1.64：蓝色 / 浅蓝色两个按钮，第二个按钮文案「取消」（取消置顶）
        pop.innerHTML = '<button onclick="window._pinPick(true)" style="padding:8px 14px;border:none;border-radius:8px;background:#1d4ed8;color:#fff;font-weight:700;cursor:pointer;font-size:0.8rem;">置顶</button>' +
            '<button onclick="window._pinPick(false)" style="padding:8px 14px;border:none;border-radius:8px;background:#dbeafe;color:#1d4ed8;font-weight:700;cursor:pointer;font-size:0.8rem;">取消</button>';
        document.body.appendChild(pop);
        const pw = pop.offsetWidth, ph = pop.offsetHeight;
        // v1.64：就近锚定到长按按下位置（手指/鼠标附近），下方放不下自动翻到上方、
        // 左右越界自动内收，弹窗贴着按压点不再与条目割裂；长按期间清单重渲染也不影响定位
        // （直接用按下坐标，不依赖行元素，顺带避免旧版左上角 bug）
        let left, top;
        if (px != null && py != null) {
            left = px + 10;
            top = py + 12;
            if (left + pw > window.innerWidth - 4) left = Math.max(4, px - pw - 10);
            if (top + ph > window.innerHeight - 4) top = Math.max(4, py - ph - 12);
        } else {
            // 兜底：按条目当前位置定位（优先下方，放不下则上方）
            const row = document.querySelector('#ext-strategy-list .zdr-import-item[data-pin-index="' + index + '"]');
            const r = row ? row.getBoundingClientRect() : null;
            if (r && (r.width || r.height)) {
                left = r.left + r.width / 2 - pw / 2;
                top = r.bottom + 6;
                if (top + ph > window.innerHeight - 4) top = r.top - ph - 6;
                left = Math.max(4, Math.min(left, window.innerWidth - pw - 4));
            } else { left = 4; top = 4; }
        }
        pop.style.left = left + 'px';
        pop.style.top = top + 'px';
        window._pinPickIndex = index;
        // 点击小窗以外空白处取消（延迟绑定，避免打开瞬间被同一事件关闭）
        window._pinPickerOutsideHandler = function(e) {
            const p = document.getElementById('zdr-pin-picker');
            if (p && !p.contains(e.target)) hideImportPinPicker();
        };
        setTimeout(function() { document.addEventListener('click', window._pinPickerOutsideHandler); }, 0);
    }
    function hideImportPinPicker() {
        const p = document.getElementById('zdr-pin-picker');
        if (p) p.remove();
        if (window._pinPickerOutsideHandler) { document.removeEventListener('click', window._pinPickerOutsideHandler); window._pinPickerOutsideHandler = null; }
        window._pinPickIndex = null;
    }
    window._pinPick = function(pinTo) {
        const index = window._pinPickIndex;
        hideImportPinPicker();
        if (index == null) return;
        window.toggleImportPin(index, pinTo);
    };
    window._hidePinPicker = hideImportPinPicker;
    window.saveImportedStrategies = saveImportedStrategies; // 供 IIFE 外部的 clearAllSelections 调用（一键清空需持久化）
    window.renderCategoryButtons = renderCategoryButtons; // 供 IIFE 外部的 clearAllSelections 调用
    window.buildItemEffects = buildItemEffects; // 供 undo 恢复时重算条目效果
    window.syncImportState = syncImportState;   // 供 undo 恢复时重新聚合导入贡献

    // 勾选/取消勾选某条导入；勾选时若条目内容全部停用则默认全部启用
    window.toggleImportItem = function(index, checked) {
        const items = window.__importedStrategies;
        if (!items || !items[index]) return;
        const it = items[index];
        const activeCat = window.__importActiveCat;
        if (activeCat && it.lottery !== activeCat) return; // 已选类别时另一类条目不可选
        pushZdrHistory();
        it.checked = !!checked;
        if (it.checked && it.parts && it.parts.length && it.parts.every(p => !p.checked)) {
            it.parts.forEach(p => { p.checked = true; });
        }
        it.effects = buildItemEffects(it.parts || []);
        // 严格互斥：勾选某类别条目时，取消另一类别的全部勾选
        enforceImportMutex(it.checked ? it.lottery : undefined);
        syncImportState();
        renderImportList();
        saveImportedStrategies();
    };

    // 点击条目内某个子选项：切换其启用状态并重算
    // 条目整体未勾选时，点击子选项 = 启用该条并只选中被点击的选项（避免反选其余选项）
    window.toggleImportPart = function(index, partIndex) {
        const items = window.__importedStrategies;
        const it = items && items[index];
        if (!it || !it.parts || !it.parts[partIndex]) return;
        const activeCat = window.__importActiveCat;
        if (activeCat && it.lottery !== activeCat) return; // 已选类别时另一类条目不可选
        pushZdrHistory();
        if (!it.checked) {
            it.checked = true;
            it.parts.forEach(p => { p.checked = false; });
            it.parts[partIndex].checked = true;
        } else {
            it.parts[partIndex].checked = !it.parts[partIndex].checked;
        }
        // 子选项全部停用时，条目级勾选同步取消
        if (it.checked && it.parts.every(p => !p.checked)) it.checked = false;
        it.effects = buildItemEffects(it.parts);
        // 严格互斥：启用某类别子选项时，取消另一类别的全部勾选
        enforceImportMutex(it.checked ? it.lottery : undefined);
        syncImportState();
        renderImportList();
        saveImportedStrategies();
    };

    // 同步“取消全选/全部启用”按钮的显示与文案
    function updateToggleAllButton() {
        const btn = document.getElementById('ext-strategy-toggle-all');
        const copyBtn = document.getElementById('ext-strategy-copy-btn');
        if (!btn) return;
        const items = window.__importedStrategies || [];
        const activeCat = window.__importActiveCat;
        // 取消全选/全部启用只作用于当前类别（未选类别时作用于全部）
        const visible = activeCat ? items.filter(it => it.lottery === activeCat) : items;
        if (!visible.length) {
            btn.style.display = 'none';
            if (copyBtn) copyBtn.style.display = 'none';
            return;
        }
        btn.style.display = 'inline-block';
        if (copyBtn) copyBtn.style.display = 'inline-block';
        btn.textContent = visible.some(it => it.checked) ? '取消全选' : '全部启用';
    }

    // 渲染「新澳门条目/香港条目」筛选按钮（有香港条目时显示；点击后清单只显示该类别条目，可来回切换）
    function renderCategoryButtons() {
        const bar = document.getElementById('ext-strategy-cat-bar');
        if (!bar) return;
        const items = window.__importedStrategies || [];
        const hasHk = items.some(it => it.lottery === 'hk');
        if (!items.length || !hasHk) {
            bar.style.display = 'none';
            return;
        }
        bar.style.display = 'flex';
        const btnM = document.getElementById('ext-strategy-cat-macau');
        const btnH = document.getElementById('ext-strategy-cat-hk');
        const active = window.__importActiveCat;
        if (btnM) {
            // 新澳门：蓝色主题（边框/文字/选中底色均为蓝色系）
            btnM.style.cssText = 'flex:1;padding:8px 12px;border-radius:6px;font-size:0.85rem;white-space:nowrap;' + (active === 'macau' ? 'border:1px solid #1d4ed8;background:#1d4ed8;color:#fff;font-weight:bold;cursor:pointer;' : 'border:1px solid #cbd5e1;background:#f1f5f9;color:#64748b;cursor:pointer;');
            btnM.disabled = false;
        }
        if (btnH) {
            // 香港：红色主题（边框/文字/选中底色均为红色系）
            btnH.style.cssText = 'flex:1;padding:8px 12px;border-radius:6px;font-size:0.85rem;white-space:nowrap;' + (active === 'hk' ? 'border:1px solid #b91c1c;background:#b91c1c;color:#fff;font-weight:bold;cursor:pointer;' : 'border:1px solid #cbd5e1;background:#f1f5f9;color:#64748b;cursor:pointer;');
            btnH.disabled = false;
        }
    }

    // 类别互斥：保证同一时刻只有一种类别有勾选条目（两类不能有交集）
    // preferred 指定保留的类别；未指定时保留当前有勾选条目的类别（都没有则保留第一条目的类别）
    window.__importCatSnap = window.__importCatSnap || {}; // 各类别被取消前的选择状态快照

    // 保存某类别的当前勾选状态（按 标题+内容 键，供切回时恢复）
    function snapshotImportCategory(cat) {
        const snap = {};
        (window.__importedStrategies || []).forEach(it => {
            if (it.lottery === cat) {
                const key = it.title + '\u0001' + it.latest_data;
                snap[key] = { checked: !!it.checked, parts: (it.parts || []).map(p => !!p.checked) };
            }
        });
        window.__importCatSnap = window.__importCatSnap || {};
        window.__importCatSnap[cat] = snap;
    }

    // 按快照恢复某类别上次的选择状态（快照中不存在的条目保持现状）
    function restoreImportCategory(cat) {
        const snap = (window.__importCatSnap || {})[cat];
        if (!snap) return;
        (window.__importedStrategies || []).forEach(it => {
            if (it.lottery === cat) {
                const key = it.title + '\u0001' + it.latest_data;
                const s = snap[key];
                if (s) {
                    it.checked = !!s.checked;
                    (it.parts || []).forEach((p, pi) => { p.checked = (s.parts && s.parts[pi] !== undefined) ? !!s.parts[pi] : true; });
                    it.effects = buildItemEffects(it.parts || []);
                }
            }
        });
    }

    function enforceImportMutex(preferred) {
        const items = window.__importedStrategies || [];
        if (!items.length) return;
        if (preferred !== 'macau' && preferred !== 'hk') {
            const checked = items.find(it => it.checked && (it.lottery === 'macau' || it.lottery === 'hk'));
            preferred = checked ? checked.lottery : (items[0].lottery || 'macau');
        }
        // 先快照将被取消的类别（有选中状态时才需要记忆），切回时按快照恢复
        ['macau', 'hk'].forEach(cat => {
            if (cat !== preferred && items.some(it => it.lottery === cat && (it.checked || (it.parts || []).some(p => p.checked)))) {
                snapshotImportCategory(cat);
            }
        });
        items.forEach(it => {
            if (it.lottery !== preferred) {
                it.checked = false;
                (it.parts || []).forEach(p => { p.checked = false; });
                it.effects = buildItemEffects(it.parts || []);
            }
        });
    }

    // 选择导入类别（筛选视图 + 严格互斥）：选中某类时恢复该类上一次的选择状态、取消另一类的全部选中；
    // 再点一次当前按钮恢复显示全部（勾选不变，互斥已保证只有一类有勾选）
    window.setImportActiveCat = function(cat) {
        if (cat !== 'macau' && cat !== 'hk') return;
        pushZdrHistory();
        if (window.__importActiveCat === cat) {
            window.__importActiveCat = null;
        } else {
            window.__importActiveCat = cat;
            // 恢复该类上一次的选择状态（无快照则保持现状）
            restoreImportCategory(cat);
            enforceImportMutex(cat);
        }
        saveImportedStrategies();
        renderCategoryButtons();
        renderImportList();
        syncImportState();
    };

    // 复制全部导入条目为 JSON（可直接粘贴回“外部专家策略提取”输入框重新导入）
    window.copyImportStrategies = function() {
        const activeCat = window.__importActiveCat;
        const allItems = window.__importedStrategies || [];
        // 复制全部只作用于当前类别（未选类别时复制全部）
        // v1.62：置顶条目排在最前，与清单显示顺序一致
        const items = (activeCat ? allItems.filter(it => it.lottery === activeCat) : allItems).slice().sort((a, b) => (b.pinned ? 1 : 0) - (a.pinned ? 1 : 0));
        const feedbackEl = document.getElementById('ext-strategy-feedback');
        if (!items.length) {
            if (feedbackEl) feedbackEl.innerHTML = '<span style="color:#f59e0b;">⚠️ 当前没有可复制的导入条目。</span>';
            return;
        }
        const text = JSON.stringify(items.map(it => ({ title: it.title, latest_data: it.latest_data, lottery: it.lottery === 'hk' ? 'hk' : 'macau' })), null, 2);
        const done = () => {
            const catLabel = activeCat === 'hk' ? '香港' : (activeCat === 'macau' ? '新澳门' : '全部');
            if (feedbackEl) feedbackEl.innerHTML = '<span style="color:#16a34a;">✅ 已复制' + catLabel + '条目 ' + items.length + ' 条，粘贴到上方输入框后点「导入新澳门条目」或「导入香港条目」即可重新导入。</span>';
        };
        const fallbackCopy = () => {
            try {
                const textArea = document.createElement("textarea");
                textArea.value = text;
                textArea.style.position = "fixed";
                textArea.style.left = "-999999px";
                document.body.appendChild(textArea);
                textArea.focus();
                textArea.select();
                document.execCommand('copy');
                textArea.remove();
                done();
            } catch (err) {
                if (feedbackEl) feedbackEl.innerHTML = '<span style="color:#ef4444;">❌ 复制失败，请手动选择复制。</span>';
            }
        };
        if (navigator.clipboard && window.isSecureContext) {
            navigator.clipboard.writeText(text).then(done).catch(fallbackCopy);
        } else {
            fallbackCopy();
        }
    };

    // 一键全选/取消全选：有启用条目→全部取消（子选项状态保留）；无启用条目→全部启用（同时启用全部子选项）
    window.toggleAllImportItems = function() {
        const items = window.__importedStrategies || [];
        if (!items.length) return;
        pushZdrHistory();
        const activeCat = window.__importActiveCat;

      try { savedPageState = JSON.parse(localStorage.getItem('zdr_page_state_v1') || 'null'); } catch (e) { /* ignore */ }
      let savedTab = (savedPageState && savedPageState.tab) || 'zdr';
      if (savedTab === 'predict') savedTab = 'macau'; // 旧版「钟道人特码」→ 新澳门特码
      if (savedTab !== 'macau' && savedTab !== 'hk') savedTab = 'zdr';
      if (savedTab !== 'zdr') {
        // 切到对应彩种预测页（内部按会话缓存/网络加载数据）
        window.__forceLotteryFetch = true; // 刷新恢复：强制重新提取最新开奖（失败时走今日离线兜底）
        switchMainTab(savedTab);
      } else if (typeof window.runPredict === 'function') {
        // 默认特码筛选器：后台预取新澳门数据
        window.runPredict();
      }

      // 恢复当天导入条目（本地持久化；非当天自动清空），并排程 23:59 自动清空
      loadImportedStrategies();
      updateParseButtonsVisibility();
      extInput.addEventListener('input', updateParseButtonsVisibility);
      if ((window.__importedStrategies || []).length) {
        // v1.62：首帧后再渲染导入清单，避免打开页面时同步整表渲染阻塞首屏（移动端卡顿优化）
        setTimeout(function() {
          renderImportList();
          syncImportState();
          updateToggleAllButton();
          scheduleImportHistoryRefresh(); // 页面恢复当天条目后自动补记历史（数据晚到也能补上）
        }, 30);
      }
      renderCategoryButtons();
      scheduleMidnightClear();
      schedulePinnedDayAdvance();
      schedulePinnedPreDrawClear();
    });






    // ==========================================
    // 监听滚动与拖动：控制悬浮气泡的显示、隐藏与拖拽定位
    // ==========================================
    (function() {
        const fabContainer = document.getElementById('strategyFabContainer');
        const fabBtn = document.getElementById('strategyFabBtn');
        const fabMenu = document.getElementById('strategyFabMenu');
        if (!fabContainer || !fabBtn) return;

        // 1. 监听滚动控制显示与隐藏
        window.addEventListener('scroll', function() {
            if (window.currentActiveTab === 'zdr') return;
            const panel = document.getElementById('strategy-panel');
            if (!panel) return;
            
            const rect = panel.getBoundingClientRect();
            if (rect.bottom < 0) {
                fabContainer.style.display = 'block';
            } else {
                fabContainer.style.display = 'none';
                if (fabMenu) fabMenu.classList.remove('show');
            }
        }, { passive: true });

        // 2. 拖拽逻辑实现 (手势拖动与PC鼠标拖动全兼容)
        let isDragging = false;
        let startX, startY;
        let initialLeft, initialTop;
        let hasMoved = false;
        const moveThreshold = 6; // 拖拽位移判定阈值(px)，防止点击气泡时手指轻微颤抖被误判成拖动

        function onStart(e) {
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;

            isDragging = true;
            hasMoved = false;

            const rect = fabContainer.getBoundingClientRect();
            initialLeft = rect.left;
            initialTop = rect.top;

            startX = clientX;
            startY = clientY;

            // 锁定绝对物理坐标：解除 right 和 bottom 属性的强绑定
            fabContainer.style.right = 'auto';
            fabContainer.style.bottom = 'auto';
            fabContainer.style.left = initialLeft + 'px';
            fabContainer.style.top = initialTop + 'px';
        }

        function onMove(e) {
            if (!isDragging) return;

            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;

            const dx = clientX - startX;
            const dy = clientY - startY;

            if (Math.abs(dx) > moveThreshold || Math.abs(dy) > moveThreshold) {
                hasMoved = true;
                if (fabMenu) fabMenu.classList.remove('show'); // 拖动过程中自动平滑收起菜单
            }

            let newLeft = initialLeft + dx;
            let newTop = initialTop + dy;

            // 屏幕边缘安全碰撞盒边界限制（各边留 10px 缓冲带）
            const pad = 10;
            const maxLeft = window.innerWidth - fabContainer.offsetWidth - pad;
            const maxTop = window.innerHeight - fabContainer.offsetHeight - pad;

            newLeft = Math.max(pad, Math.min(newLeft, maxLeft));
            newTop = Math.max(pad, Math.min(newTop, maxTop));

            fabContainer.style.left = newLeft + 'px';
            fabContainer.style.top = newTop + 'px';

            if (e.cancelable) e.preventDefault(); // 阻断并压制移动端屏幕默认的跟随弹性滚动
        }

        function onEnd() {
            if (!isDragging) return;
            isDragging = false;
        }

        // 注册拖拽监听总线
        fabBtn.addEventListener('mousedown', onStart);
        document.addEventListener('mousemove', onMove, { passive: false });
        document.addEventListener('mouseup', onEnd);

        fabBtn.addEventListener('touchstart', onStart, { passive: true });
        fabBtn.addEventListener('touchmove', onMove, { passive: false });
        fabBtn.addEventListener('touchend', onEnd);

        // 3. 自适应逻辑：防止拖拽结束后产生误点击并智能定位菜单弹窗朝向
        fabBtn.addEventListener('click', function(e) {
            e.stopPropagation();
            if (hasMoved) return; // 判定结果为拖动操作结束时，彻底物理阻断 click 行为

            if (fabMenu) {
                const rect = fabContainer.getBoundingClientRect();
                // 核心算法：以屏幕中心垂直线为界，智能判定悬浮球位置并倒置 origin 朝向
                const isLeftHalf = rect.left < window.innerWidth / 2;
                if (isLeftHalf) {
                    fabMenu.style.right = 'auto';
                    fabMenu.style.left = '0';
                    fabMenu.style.transformOrigin = 'bottom left';
                } else {
                    fabMenu.style.left = 'auto';
                    fabMenu.style.right = '0';
                    fabMenu.style.transformOrigin = 'bottom right';
                }
                fabMenu.classList.toggle('show');
            }
        });



        // 阻拦捕获：点击悬浮球外部任意区域自动收起菜单
        document.addEventListener('click', function(event) {
            if (fabContainer && fabMenu && fabMenu.classList.contains('show')) {
                if (!fabContainer.contains(event.target)) {
                    fabMenu.classList.remove('show');
                }
            }
        });

        // 窗口自适应防溢出边界纠正机制
        window.addEventListener('resize', function() {
            // 如果悬浮球未被拖拽过（依然使用原生CSS right/bottom 定位），则直接跳过无需干预
            if (!fabContainer || fabContainer.style.left === 'auto' || fabContainer.style.left === '') return;
            
            const pad = 10;
            const maxLeft = window.innerWidth - fabContainer.offsetWidth - pad;
            const maxTop = window.innerHeight - fabContainer.offsetHeight - pad;
            
            let currentLeft = parseFloat(fabContainer.style.left);
            let currentTop = parseFloat(fabContainer.style.top);
            
            // 如果当前绝对坐标超出了窗口缩放后的新边界，将其强行拉回贴边
            if (currentLeft > maxLeft) {
                fabContainer.style.left = Math.max(pad, maxLeft) + 'px';
            }
            if (currentTop > maxTop) {
                fabContainer.style.top = Math.max(pad, maxTop) + 'px';
            }
        }, { passive: true });
    })();

})();
</script>

<!-- ========== 通用自绘模态框（alert / confirm / prompt 替换原生调用） ========== -->
<div id="zdrDialogOverlay" class="zdr-modal-overlay">
    <div class="zdr-modal" role="dialog" aria-modal="true">
        <div class="zdr-modal-title" id="zdrDialogTitle"></div>
        <div class="zdr-modal-body" id="zdrDialogBody"></div>
        <input type="text" class="zdr-modal-input" id="zdrDialogInput" style="display:none;" autocomplete="off">
        <div class="zdr-modal-actions" id="zdrDialogActions"></div>
    </div>
</div>

<!-- ========== 新增：补充数据弹窗及逻辑 ========== -->
<div id="suppModalOverlay" class="supp-modal-overlay">
    <div class="supp-modal">
        <h3>手动补充开奖数据</h3>
        <div class="supp-form-group">
            <label>年份 (如: 2026)</label>
            <input type="number" id="supp-year" placeholder="请输入4位完整年份">
        </div>
        <div class="supp-form-group">
            <label>期数 (如: 199)</label>
            <input type="number" id="supp-qishu" placeholder="请输入期数">
        </div>
        <div class="supp-form-group">
            <label>开奖号码 (逗号或空格分隔，含特码)</label>
            <input type="text" id="supp-nums" placeholder="例: 17,49,42,45,05,38,36">
        </div>
        <div class="supp-actions">
            <button class="supp-btn-cancel" onclick="window.closeSuppModal()">取消</button>
            <button class="supp-btn-save" onclick="window.saveSuppData()">匹配并保存</button>
        </div>
    </div>
</div>

<script>
// 弹窗开关控制
window.openSuppModal = function() {
    document.getElementById('suppModalOverlay').style.display = 'flex';
    // 默认填充当前年份
    if(!document.getElementById('supp-year').value) {
        document.getElementById('supp-year').value = new Date().getFullYear();
    }
};
window.closeSuppModal = function() {
    document.getElementById('suppModalOverlay').style.display = 'none';
};

// ========== 通用自绘模态框引擎：替换原生 alert / confirm / prompt ==========
(function() {
    const overlay = document.getElementById('zdrDialogOverlay');
    const titleEl = document.getElementById('zdrDialogTitle');
    const bodyEl = document.getElementById('zdrDialogBody');
    const inputEl = document.getElementById('zdrDialogInput');
    const actionsEl = document.getElementById('zdrDialogActions');
    if (!overlay) return;

    let activeResolve = null; // 当前弹窗的 Promise 回调
    let promptMode = false;   // 是否为输入框模式（Esc / 遮罩 = null）

    function closeDialog(result) {
        overlay.classList.remove('show');
        overlay.style.display = 'none';
        actionsEl.innerHTML = '';
        inputEl.style.display = 'none';
        inputEl.value = '';
        promptMode = false;
        document.removeEventListener('keydown', onKeydown);
        const resolve = activeResolve;
        activeResolve = null;
        if (resolve) resolve(result);
    }

    function onKeydown(e) {
        if (e.key === 'Escape') {
            e.preventDefault();
            closeDialog(promptMode ? null : false);
        } else if (e.key === 'Enter' && promptMode) {
            e.preventDefault();
            closeDialog(inputEl.value);
        }
    }
    overlay.addEventListener('click', function(e) {
        if (e.target === overlay) closeDialog(promptMode ? null : false);
    });

    function openDialog(opts) {
        return new Promise(function(resolve) {
            activeResolve = resolve;
            titleEl.textContent = opts.title || '';
            bodyEl.textContent = opts.message || '';
            if (opts.input) {
                promptMode = true;
                inputEl.placeholder = opts.placeholder || '';
                inputEl.value = opts.defaultValue !== undefined && opts.defaultValue !== null ? String(opts.defaultValue) : '';
                inputEl.style.display = 'block';
            }
            (opts.buttons || []).forEach(function(b) {
                const btn = document.createElement('button');
                btn.textContent = b.text;
                btn.className = b.className || 'zdr-btn-cancel';
                btn.onclick = function() { closeDialog(b.value === '__INPUT__' ? inputEl.value : b.value); };
                actionsEl.appendChild(btn);
            });
            overlay.style.display = 'flex';
            overlay.classList.add('show');
            document.addEventListener('keydown', onKeydown);
            if (promptMode) setTimeout(function() { try { inputEl.focus(); } catch (e) { /* ignore */ } }, 30);
        });
    }

    window.zdrAlert = function(message, opts) {
        opts = opts || {};
        const type = opts.type || 'info';
        const btnClass = type === 'success' ? 'zdr-btn-green' : (type === 'error' ? 'zdr-btn-danger' : 'zdr-btn-primary');
        return openDialog({
            title: opts.title || (type === 'success' ? '✅ 操作成功' : type === 'error' ? '❌ 提示' : '提示'),
            message: message,
            buttons: [{ text: opts.okText || '确定', className: btnClass, value: true }]
        });
    };

    window.zdrConfirm = function(message, opts) {
        opts = opts || {};
        const okClass = opts.danger ? 'zdr-btn-danger' : 'zdr-btn-primary';
        return openDialog({
            title: opts.title || '请确认',
            message: message,
            buttons: [
                { text: opts.cancelText || '取消', className: 'zdr-btn-cancel', value: false },
                { text: opts.okText || '确定', className: okClass, value: true }
            ]
        });
    };

    window.zdrPrompt = function(message, opts) {
        opts = opts || {};
        return openDialog({
            title: opts.title || '请输入',
            message: message,
            input: true,
            placeholder: opts.placeholder || '',
            defaultValue: opts.defaultValue,
            buttons: [
                { text: '取消', className: 'zdr-btn-cancel', value: null },
                { text: '确定', className: 'zdr-btn-primary', value: '__INPUT__' }
            ]
        });
    };
})();

// 工具1：获取特定年份特定号码的生肖
window.getZodiacForYearAndNum = function(num, year) {
    var offset = (year - 2026) % 12;
    if (offset < 0) offset += 12; 
    var map = {};
    zodiacOrder.forEach(function(zodiac, index) {
        var shiftedIndex = (index + offset) % 12;
        map[zodiac] = baseZodiacMap[zodiacOrder[shiftedIndex]];
    });
    for (var z in map) {
        if (map[z].includes(num)) return z;
    }
    return "?";
};

// 工具2：获取特定号码的五行（避免局部作用域隔离，独立实现）
window.getElementForNum = function(num) {
    var eMap = {
        '金': ['04','05','12','13','26','27','34','35','42','43'],
        '木': ['08','09','16','17','24','25','38','39','46','47'],
        '水': ['01','14','15','22','23','30','31','44','45'],
        '火': ['02','03','10','11','18','19','32','33','40','41','48','49'],
        '土': ['06','07','20','21','28','29','36','37']
    };
    for (var e in eMap) {
        if (eMap[e].includes(num)) return e;
    }
    return "?";
};

// 保存补充数据事件
window.saveSuppData = function() {
    var year = document.getElementById('supp-year').value.trim();
    var qishu = document.getElementById('supp-qishu').value.trim();
    var numsInput = document.getElementById('supp-nums').value.trim();

    if (!year || !qishu || !numsInput) {
        window.zdrAlert("请填写完整的年份、期数和号码！", { type: "error" });
        return;
    }

    // 支持逗号、中文逗号、空格分隔，并过滤空值、强转两位数填充
    var nums = numsInput.split(/[,，\s]+/).filter(function(n) { return n !== ""; }).map(function(n) {
        return n.padStart(2, '0');
    });

    if (nums.length === 0) {
        window.zdrAlert("未识别到有效号码，请检查输入格式！", { type: "error" });
        return;
    }

    // 自动匹配生肖和五行
    var yearInt = parseInt(year);
    var sxs = nums.map(function(n) { return window.getZodiacForYearAndNum(n, yearInt); });
    var wxs = nums.map(function(n) { return window.getElementForNum(n); }); 

    // 生成 API 兼容的标准记录对象
    var record = {
        id: parseInt(year + qishu.padStart(3, '0')),
        year: yearInt,
        qishu: qishu.padStart(3, '0'),
        date: year + '-手动补充',
        num: nums.join(','),
        shengxiao: sxs.join(','),
        wuxing: wxs.join(',')
    };

    // 存入当前彩种专属的 localStorage
    var storageKey = 'zdr_manual_data_' + (typeof window.getCurrentLottery === 'function' ? window.getCurrentLottery() : 'macau');
    var manualDataStr = localStorage.getItem(storageKey);
    var manualData = manualDataStr ? JSON.parse(manualDataStr) : [];
    
    // 过滤掉相同 id 的旧数据，防止因修改导致的重复写入
    manualData = manualData.filter(function(d) { return d.id !== record.id; });
    manualData.push(record);
    
    localStorage.setItem(storageKey, JSON.stringify(manualData));
    // v1.62：手动补充数据后同步失效本地记录会话缓存，保证历史战绩/预测立刻读到新数据
    if (typeof window.invalidateLocalRecordsCache === 'function') window.invalidateLocalRecordsCache();

    window.zdrAlert("✅ 数据补充成功！系统已自动为您匹配：\n生肖：" + sxs.join(',') + "\n五行：" + wxs.join(',') + "\n\n弹窗关闭后系统将自动重新获取并应用数据。", { type: "success", title: "补充成功" });
    
    window.closeSuppModal();
    
    // 清空输入框状态，保留年份提升录入效率
    document.getElementById('supp-qishu').value = '';
    document.getElementById('supp-nums').value = '';

    // 重新运行预测流，新数据将无缝合并
    if (typeof window.runPredict === 'function') {
        window.runPredict();
    }
};
</script>
