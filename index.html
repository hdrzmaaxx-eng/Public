    }

    // 在当前导入清单中找旧标题记录应归属的条目：唯一最优匹配才迁移（避免同名不同站误并）
    function findHistoryTarget(recordTitle, lottery, recordParts, items) {
        let best = null, bestScore = 0, tied = false;
        (items || []).forEach(it => {
            if (it.lottery && lottery && it.lottery !== lottery) return;
            const sc = historyMatchScore(recordTitle, recordParts, it);
            if (sc > bestScore) { best = it; bestScore = sc; tied = false; }
            // 同一策略的多期条目会同时命中；只要稳定历史键一致，就不是歧义。
            else if (sc > 0 && sc === bestScore && importHistoryKey(it) !== importHistoryKey(best)) tied = true;
        });
        return (bestScore > 0 && !tied) ? best : null;
    }

    // 标题规范化后迁移旧历史键到当前条目（如无标签旧键 → 带网站标签的新键），按期数去重合并
    function migrateHistoryKeys(map) {
        const items = window.__importedStrategies || [];
        if (!items.length) return false;
        let changed = false;
        Object.keys(map).forEach(k => {
            const h = map[k];
            if (!h) return;
            const keyTitle = String(h.title || historyTitleFromKey(k) || '');
            const lottery = h.lottery || String(k).split('|')[0] || 'macau';
            const parts = (h.periods && h.periods.length) ? h.periods[h.periods.length - 1].partsText : '';
            // 已与当前某条目同键（标题完全一致）则无需迁移
            const exact = items.some(it => importHistoryKey(it) === k);
            if (exact) return;
            const target = findHistoryTarget(keyTitle, lottery, parts, items);
            if (!target) return;
            const newKey = importHistoryKey(target);
            if (newKey === k) return;
            if (map[newKey]) {
                const byQ = {};
                (map[newKey].periods || []).forEach(p => { if (p && p.qishu != null) byQ[parseInt(p.qishu, 10)] = p; });
                (h.periods || []).forEach(p => { if (p && p.qishu != null && !byQ[parseInt(p.qishu, 10)]) byQ[parseInt(p.qishu, 10)] = p; });
                map[newKey].periods = Object.keys(byQ).map(q => byQ[q]).sort((a, b) => parseInt(a.qishu, 10) - parseInt(b.qishu, 10)).slice(-IMPORT_HISTORY_LIMIT);
                map[newKey].updatedAt = new Date().toISOString();
            } else {
                map[newKey] = Object.assign({}, h, {
                    title: String(target.title || '').replace(/^\s*\d{1,4}期[:：]?\s*/, ''),
                    updatedAt: new Date().toISOString()
                });
            }
            delete map[k];
            changed = true;
        });
        return changed;
    }

    let __histMapCache = null; // v1.62：会话内缓存历史战绩表，避免每次渲染都重新解析 localStorage
    function loadImportHistories() {
        if (__histMapCache) return __histMapCache;
        try {
            const raw = localStorage.getItem(IMPORT_HISTORY_KEY);
            const data = raw ? JSON.parse(raw) : null;
            __histMapCache = (data && typeof data === 'object' && !Array.isArray(data)) ? data : {};
        } catch (e) { __histMapCache = {}; }
        return __histMapCache;
    }

    // 保存历史：每条只保留最近 10 期（超出的自动删除），历史条目总量设上限防止无限增长
    function saveImportHistories(map) {
        try {
            Object.keys(map).forEach(k => {
                const h = map[k];
                if (!h || !Array.isArray(h.periods)) return;
                if (h.periods.length > IMPORT_HISTORY_LIMIT) h.periods = h.periods.slice(-IMPORT_HISTORY_LIMIT);
            });
            const keys = Object.keys(map);
            if (keys.length > 1000) {
                keys.sort((a, b) => (map[a].updatedAt || '').localeCompare(map[b].updatedAt || ''));
                keys.slice(0, keys.length - 1000).forEach(k => delete map[k]);
            }
            __histMapCache = map;
            localStorage.setItem(IMPORT_HISTORY_KEY, JSON.stringify(map));
            return true;
        } catch (e) { return false; }
    }

    // v1.62：本地开奖数据只保留最近 LOTTERY_DATA_LIMIT 条（历史版本无限累积导致打开页面卡顿）
    const LOTTERY_DATA_LIMIT = 120;
    function trimLotteryData(list) {
        if (!Array.isArray(list) || list.length <= LOTTERY_DATA_LIMIT) return list;
        return list.slice().sort(function(a, b) { return (b.id || 0) - (a.id || 0); }).slice(0, LOTTERY_DATA_LIMIT);
    }
    let __localRecordsCache = { macau: null, hk: null }; // 会话内缓存本地开奖记录解析结果
    let __localTrimDone = { macau: false, hk: false };   // 存量超大数据的惰性裁剪只做一次
    function invalidateLocalRecordsCache(lottery) {
        if (lottery) { __localRecordsCache[lottery] = null; }
        else { __localRecordsCache = { macau: null, hk: null }; }
    }

    // 把某类别开奖数据合并写入本地持久存储（按 id 覆盖/追加），供历史战绩离线使用（跨标签/刷新后仍可用）
    function persistLotteryData(lottery, records) {
        try {
            if (!Array.isArray(records) || !records.length) return;
            const storageKey = 'zdr_manual_data_' + lottery;
            let localData = [];
            const raw = localStorage.getItem(storageKey);
            if (raw) { try { const parsed = JSON.parse(raw); if (Array.isArray(parsed)) localData = parsed; } catch (e) { /* ignore */ } }
            records.forEach(r => {
                if (!r || r.id == null) return;
                const idx = localData.findIndex(d => d && d.id === r.id);
                if (idx > -1) localData[idx] = r; else localData.push(r);
            });
            localData = trimLotteryData(localData); // 只保留最近 120 条，防止无限增长
            localStorage.setItem(storageKey, JSON.stringify(localData));
            invalidateLocalRecordsCache(lottery);
            // 记录当日缓存日期标记，网络失败时可作今日离线兜底
            const d = new Date();
            localStorage.setItem('zdr_cache_date_' + lottery, d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'));
        } catch (e) { /* ignore */ }
    }
    window.persistLotteryData = persistLotteryData; // 供 runPredict / ps 在数据到达时调用
    window.invalidateLocalRecordsCache = invalidateLocalRecordsCache; // 供外部手动补数据时同步失效会话缓存

    // 悬浮提示用：汇总条目的子选项文本（如「选肖:羊 狗 龙 …；杀肖:虎 牛」）
    function summarizeItemParts(parts) {
        const groups = {};
        const order = [];
        (parts || []).forEach(p => {
            const label = p.label || '选项';
            if (!groups[label]) { groups[label] = []; order.push(label); }
            groups[label].push(p.display != null ? String(p.display) : String(p.value));
        });
        return order.map(l => l + ':' + groups[l].join(' ')).join('；');
    }

    // 取某类别全部开奖记录（优先本会话已加载的新鲜数据，其次当前内存数据，最后本地持久数据），按 id 去重升序
    // freshOnly=true 时仅返回可视为“当前”的新鲜数据（本地来源还须当天写入标记），用于计算当期期数，避免旧数据算出过期期数
    function getAllLotteryRecords(lottery, freshOnly) {
        let list = null;
        let fromLocal = false;
        if (window.__lotteryData && Array.isArray(window.__lotteryData[lottery]) && window.__lotteryData[lottery].length) {
            // 会话内已加载过该彩种（本会话必为当天数据），避免跨彩种读取时用旧本地数据算出过期期数
            list = window.__lotteryData[lottery];
        } else if (lottery === currentLottery && Array.isArray(window._rawKjData) && window._rawKjData.length) {
            list = window._rawKjData;
        } else {
            try {
                let parsed = __localRecordsCache[lottery];
                if (parsed == null) {
                    const raw = localStorage.getItem('zdr_manual_data_' + lottery);
                    if (raw) {
                        parsed = JSON.parse(raw);
                        if (Array.isArray(parsed)) {
                            // 历史存量超大数据的惰性一次性裁剪（旧版本无上限累积，本次加载即收敛）
                            if (parsed.length > LOTTERY_DATA_LIMIT && !__localTrimDone[lottery]) {
                                __localTrimDone[lottery] = true;
                                const trimmed = trimLotteryData(parsed);
                                try { localStorage.setItem('zdr_manual_data_' + lottery, JSON.stringify(trimmed)); } catch (e) { /* ignore */ }
                                parsed = trimmed;
                            }
                        }
                    }
                }
                if (Array.isArray(parsed) && parsed.length) { list = parsed; fromLocal = true; }
                if (Array.isArray(parsed)) __localRecordsCache[lottery] = parsed;
            } catch (e) { /* ignore */ }
        }
        if (freshOnly && list && list.length) {
            if (fromLocal) {
                try {
                    const todayStr = (function() { var x = new Date(); return x.getFullYear() + '-' + String(x.getMonth() + 1).padStart(2, '0') + '-' + String(x.getDate()).padStart(2, '0'); })();
                    if (localStorage.getItem('zdr_cache_date_' + lottery) !== todayStr) list = null;
                } catch (e) { list = null; }
            }
            if (list && !isLotteryDataFresh(lottery, list)) list = null;
        }
        if (!list || !list.length) return [];
        const seen = {};
        const uniq = [];
        list.forEach(r => {
            if (r && r.id != null && !seen[r.id]) { seen[r.id] = true; uniq.push(r); }
        });
        uniq.sort((a, b) => a.id - b.id);
        return uniq;
    }

    // 查找某类别指定期数的开奖记录（只匹配当前年份，避免跨年误配到上一年的同号期，
    // 如香港 2026 年 087 未开时误配到 2025-08-12 的 087）
    function findDrawRecordByPeriod(lottery, period) {
        const year = new Date().getFullYear();
        const list = getAllLotteryRecords(lottery);
        let best = null;
        list.forEach(r => {
            const rYear = r.year != null ? parseInt(r.year, 10) : Math.floor(r.id / 1000);
            if (rYear !== year) return;
            if (r && r.qishu != null && parseInt(r.qishu, 10) === period && (!best || r.id > best.id)) best = r;
        });
        return best;
    }

    // 从开奖记录取特码（统一补足两位）
    function getTmFromRecord(r) {
        const nums = String(r.num || '').split(/[,，]/);
        const tm = nums[nums.length - 1];
        if (tm == null || String(tm).trim() === '') return '';
        return String(tm).trim().padStart(2, '0');
    }

    // 判断某期特码是否命中该条目策略（选入类各维度取交集，冻结/杀肖/杀尾排除）
    function entryHitsPeriod(effects, t) {
        if (!t) return false;
        if (effects.numbers.size && !effects.numbers.has(t)) return false;
        if (effects.firstDigit.size && !effects.firstDigit.has(t.slice(0, 1))) return false;
        if (effects.lastDigit.size && !effects.lastDigit.has(t.slice(-1))) return false;
        if (effects.size.size && !effects.size.has(parseInt(t, 10) >= 25 ? 'big' : 'small')) return false;
        if (effects.oddEven.size && !effects.oddEven.has(parseInt(t, 10) % 2 === 1 ? 'odd' : 'even')) return false;
        if (effects.compositeOddEven.size) {
            const co = compositeOddEvenMap.compositeOdd.includes(t) ? 'compositeOdd' : 'compositeEven';
            if (!effects.compositeOddEven.has(co)) return false;
        }
        if (effects.color.size) {
            const c = redNums.includes(t) ? '红' : (blueNums.includes(t) ? '蓝' : (greenNums.includes(t) ? '绿' : '?'));
            if (!effects.color.has(c + '波' + (parseInt(t, 10) % 2 === 1 ? '单' : '双'))) return false;
        }
        if (effects.element.size) {
            let e = '?';
            for (const k in elementMap) if (elementMap[k].includes(t)) { e = k; break; }
            if (!effects.element.has(e)) return false;
        }
        const inGroup = (map, tm) => { for (const k in map) if (map[k].includes(tm)) return k; return null; };
        if (effects.weather.size) {
            const w = inGroup(weatherMap, t);
            if (!w || !effects.weather.has(w)) return false;
        }
        if (effects.season.size) {
            const s = inGroup(seasonMap, t);
            if (!s || !effects.season.has(s)) return false;
        }
        if (effects.art.size) {
            const a = inGroup(artMap, t);
            if (!a || !effects.art.has(a)) return false;
        }
        if (effects.animalType.size) {
            const at = inGroup(animalTypeMap, t);
            if (!at || !effects.animalType.has(at)) return false;
        }
        if (effects.genderZodiac.size) {
            const g = inGroup(genderZodiacMap, t);
            if (!g || !effects.genderZodiac.has(g)) return false;
        }
        if (effects.yinYangZodiac.size) {
            const y = inGroup(yinYangZodiacMap, t);
            if (!y || !effects.yinYangZodiac.has(y)) return false;
        }
        if (effects.frozen.size) {
            const frozenNums = new Set();
            effects.frozen.forEach(k => {
                if (k.indexOf('zodiac:') === 0) (zodiacMap[k.slice(7)] || []).forEach(n => frozenNums.add(n));
                else if (k.indexOf('num:') === 0) frozenNums.add(k.slice(4).padStart(2, '0'));
                else if (k.indexOf('lastDigit:') === 0) (lastDigitMap[k.slice(10)] || []).forEach(n => frozenNums.add(n));
            });
            if (frozenNums.has(t)) return false;
        }
        return true;
    }

    // 历史战绩始终按条目导入时的完整内容计算（与当前勾选/停用状态无关），
    // 避免「一键清空/取消全选」导致第三排变成「全部选项已停用」而不显示期数
    function fullItemEffects(it) {
        const parts = (it.parts || []).map(p => Object.assign({}, p, { checked: true }));
        return buildItemEffects(parts);
    }

    // 累积/更新单条条目的本期战绩：只对自身期数一一对应判定（无期数或该期未开奖则跳过；有变化才返回 true）
    function updateEntryHistory(map, it) {
        const period = extractItemPeriod(it);
        if (period == null) return false;
        const rec = findDrawRecordByPeriod(it.lottery, period);
        if (!rec) return false; // 该期开奖数据还没到，等数据刷新后自动补记
        // 23:59 清空置顶子条目后 parts 为空：不得用空 parts 重算或新建当期记录，
        // 否则会把开奖时已登记的真实中/不中战绩覆盖成无约束的“中”（v1.84 修复 v1.82 回归）。
        if (!(it.parts || []).length) return false;
        const hit = entryHitsPeriod(fullItemEffects(it), getTmFromRecord(rec));
        const partsText = summarizeItemParts(it.parts || []);
        // 记录该期开奖特码信息（号码/生肖/五行/波色），供悬浮提示显示
        const tm = getTmFromRecord(rec);
        let sx = '', wx = '', color = '';
        if (tm) {
            for (const z in zodiacMap) if (zodiacMap[z].includes(tm)) { sx = z; break; }
            for (const k in elementMap) if (elementMap[k].includes(tm)) { wx = k; break; }
            color = redNums.includes(tm) ? '红' : (blueNums.includes(tm) ? '蓝' : (greenNums.includes(tm) ? '绿' : ''));
        }
        const key = importHistoryKey(it);
        const prev = map[key];
        const next = (prev && Array.isArray(prev.periods) ? prev.periods.filter(p => !(p.qishu != null && parseInt(p.qishu, 10) === period)) : []);
        next.push({ qishu: String(rec.qishu), hit: hit, partsText: partsText, tm: tm, sx: sx, wx: wx, color: color });
        next.sort((a, b) => parseInt(a.qishu, 10) - parseInt(b.qishu, 10));
        if (next.length > IMPORT_HISTORY_LIMIT) next.splice(0, next.length - IMPORT_HISTORY_LIMIT);
        if (prev && JSON.stringify(prev.periods || []) === JSON.stringify(next)) return false;
        map[key] = { lottery: it.lottery || 'macau', title: String(it.title || '').replace(/^\s*\d{1,4}期[:：]?\s*/, ''), periods: next, updatedAt: new Date().toISOString() };
        return true;
    }

    // 惰性补齐并持久化全部导入条目的本期战绩（有变化才写存储；返回最新历史表）
    function ensureImportHistories() {
        const items = window.__importedStrategies || [];
        const map = loadImportHistories();
        let changed = false;
        // 标题规范化/改名后：把旧标题的历史记录迁移到当前条目的新键（唯一匹配才迁移）
        if (migrateHistoryKeys(map)) changed = true;
        items.forEach(it => {
            if (updateEntryHistory(map, it)) changed = true;
        });
        // v1.68：移除「本地开奖数据查不到当期就删」的自动清理——该逻辑会把离线/数据未到/数据不完整时
        // 的有效历史期数连带删除（严重时整键清空 zdr_import_history_v2）。跨年误配已在写入端由
        // findDrawRecordByPeriod 的当年份过滤挡住（v1.29 同次修复）；历史中已存在的误配记录会在
        // 对应期数正常开出时由 updateEntryHistory 按期数覆盖自愈，无需自动删除。
        if (changed) saveImportHistories(map);
        return map;
    }

    // 开奖数据刷新后登记历史并刷新清单；置顶条目期数只由午夜确认任务推进。
    function refreshImportHistories() {
        ensureImportHistories();
        if (typeof renderImportList === 'function') renderImportList();
    }
    window.refreshImportHistories = refreshImportHistories;

    // ========== v1.49：历史战绩自动补记 + 跨设备导出/导入 ==========
    // 判断当前是否已有任何可用的开奖数据（会话缓存 / 内存 / 本地存储）
    let __hasDataCache = { at: 0, value: false }; // v1.62：2 秒内复用结果，避免每次渲染都解析两个彩种的大数组
    function hasAnyLotteryData() {
        const now = Date.now();
        if (now - __hasDataCache.at < 2000) return __hasDataCache.value;
        let found = false;
        try {
            if (!found && window.__lotteryData && Object.keys(window.__lotteryData).some(k => Array.isArray(window.__lotteryData[k]) && window.__lotteryData[k].length)) found = true;
            if (!found && window._rawKjData && Array.isArray(window._rawKjData) && window._rawKjData.length) found = true;
            if (!found) {
                const lotKeys = ['macau', 'hk'];
                for (let i = 0; i < lotKeys.length; i++) {
                    const raw = localStorage.getItem('zdr_manual_data_' + lotKeys[i]);
                    if (raw) {
                        const p = JSON.parse(raw);
                        if (Array.isArray(p) && p.length) { found = true; break; }
                    }
                }
            }
        } catch (e) { /* ignore */ }
        __hasDataCache = { at: now, value: found };
        return found;
    }

    let __historyRefreshTimer = null;
    let __historyRefreshTicks = 0;

    // 导入条目后自动补记历史：每 8 秒检查一次，最长约 64 秒；
    // 开奖数据一到就重算并刷新清单；首次检查无数据时后台再预取一次（Kiwi 上无油猴直连，数据常晚到）
    function scheduleImportHistoryRefresh() {
        if (__historyRefreshTimer) return;
        __historyRefreshTicks = 0;
        const tick = () => {
            __historyRefreshTicks++;
            if (__historyRefreshTicks === 1 && !hasAnyLotteryData() && typeof window.runPredict === 'function') {
                try { window.runPredict(); } catch (e) { /* ignore */ }
            }
            ensureImportHistories();
            if (typeof renderImportList === 'function') renderImportList();
            const items = window.__importedStrategies || [];
            const allRecorded = items.length > 0 && items.every(it => {
                const period = extractItemPeriod(it);
                if (period == null) return true;
                const h = loadImportHistories()[importHistoryKey(it)];
                return h && Array.isArray(h.periods) && h.periods.some(p => p && p.qishu != null && parseInt(p.qishu, 10) === period);
            });
            if (allRecorded || __historyRefreshTicks >= 8) {
                if (__historyRefreshTimer) { clearInterval(__historyRefreshTimer); __historyRefreshTimer = null; }
            }
        };
        setTimeout(tick, 600); // v1.62：首帧后再开始自动补记，避免打开页面时同步整表重算阻塞首屏（移动端卡顿优化）
        if (!__historyRefreshTimer) __historyRefreshTimer = setInterval(tick, 8000);
    }
    window.scheduleImportHistoryRefresh = scheduleImportHistoryRefresh;

    // 历史导出/导入按钮的即时反馈：成功变绿+✓、失败变红+✗，文字整句替换（如 复制成功/复制失败），
    // 带 0.4 秒弹跳动画，1.6 秒后恢复原样式
    function flashHistoryAction(btn, ok, okText, failText) {
        if (!btn) return;
        const mark = ok
            ? '<svg viewBox="0 0 24 24" width="14" height="14" stroke="currentColor" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px;margin-right:3px;"><polyline points="20 6 9 17 4 12"></polyline></svg>'
            : '<svg viewBox="0 0 24 24" width="14" height="14" stroke="currentColor" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px;margin-right:3px;"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>';
        const orig = btn.innerHTML;
        btn.innerHTML = mark + (ok ? okText : failText);
        btn.style.background = ok ? '#16a34a' : '#dc2626';
        btn.style.color = '#fff';
        btn.style.borderColor = ok ? '#16a34a' : '#dc2626';
        btn.classList.add('hist-btn-flash');
        setTimeout(function() {
            btn.innerHTML = orig;
            btn.style.background = '';
            btn.style.color = '';
            btn.style.borderColor = '';
            btn.classList.remove('hist-btn-flash');
        }, 1600);
    }

    // 历史导出/导入方式小弹窗：固定在按钮附近（优先下方，放不下则上方），
    // 点击小窗以外空白处取消，不使用全屏遮罩（移动端也不遮挡整页）
    function showHistoryActionPicker(btn, options) {
        hideHistoryActionPicker();
        const pop = document.createElement('div');
        pop.id = 'zdr-history-picker';
        pop.style.cssText = 'position:fixed;z-index:99999;background:#ffffff;border:1px solid #e2e8f0;border-radius:10px;box-shadow:0 6px 18px rgba(0,0,0,0.15);padding:6px;display:flex;flex-direction:column;gap:4px;min-width:122px;';
        options.forEach(o => {
            const b = document.createElement('button');
            b.innerText = o.text;
            b.style.cssText = 'display:block;width:100%;padding:8px 12px;border:none;border-radius:8px;cursor:pointer;font-size:0.8rem;font-weight:700;color:#fff;background:' + (o.color || '#1d4ed8') + ';';
            b.onclick = function(e) {
                e.stopPropagation();
                hideHistoryActionPicker();
                o.action();
            };
            pop.appendChild(b);
        });
        document.body.appendChild(pop);
        const r = btn.getBoundingClientRect();
        const pw = pop.offsetWidth, ph = pop.offsetHeight;
        let left = r.left + r.width / 2 - pw / 2;
        left = Math.max(4, Math.min(left, window.innerWidth - pw - 4));
        let top = r.bottom + 6;
        if (top + ph > window.innerHeight - 4) top = r.top - ph - 6;
        pop.style.left = left + 'px';
        pop.style.top = top + 'px';
        // 点击小窗以外的空白处取消（延迟绑定，避免打开瞬间被同一事件关闭）
        window._historyPickerOutsideHandler = function(e) {
            const p = document.getElementById('zdr-history-picker');
            if (p && !p.contains(e.target)) hideHistoryActionPicker();
        };
        setTimeout(function() { document.addEventListener('click', window._historyPickerOutsideHandler); }, 0);
    }
    function hideHistoryActionPicker() {
        const p = document.getElementById('zdr-history-picker');
        if (p) p.remove();
        if (window._historyPickerOutsideHandler) { document.removeEventListener('click', window._historyPickerOutsideHandler); window._historyPickerOutsideHandler = null; }
    }
    window._historyPickerCancel = hideHistoryActionPicker;

    // 导出历史条目：点击弹小窗选择方式（复制导出 / 导出JSON文件）
    window.exportImportHistories = function(btn) {
        const map = loadImportHistories();
        const keys = Object.keys(map);
        const feedbackEl = document.getElementById('ext-strategy-feedback');
        if (!keys.length) {
            flashHistoryAction(btn, false, '复制成功', '复制失败');
            if (feedbackEl) feedbackEl.innerHTML = '<span style="color:#f59e0b;">⚠️ 当前没有可导出的历史战绩（需先加载开奖数据并导入条目）。</span>';
            return;
        }
        const totalPeriods = keys.reduce((s, k) => s + ((map[k] && map[k].periods) ? map[k].periods.length : 0), 0);
        showHistoryActionPicker(btn, [
            { text: '复制导出', color: '#1d4ed8', action: function() { copyImportHistories(btn, map, keys, totalPeriods, feedbackEl); } },
            { text: '导出JSON文件', color: '#059669', action: function() { downloadImportHistories(btn, map, keys, totalPeriods, feedbackEl); } }
        ]);
    };

    // 复制导出（原逻辑）：把本地战绩序列化为 JSON 复制到剪贴板（跨设备迁移，Kiwi 粘贴回本机合并）
    function copyImportHistories(btn, map, keys, totalPeriods, feedbackEl) {
        const text = JSON.stringify(map, null, 2);
        const done = () => {
            flashHistoryAction(btn, true, '复制成功', '复制失败');
            if (feedbackEl) feedbackEl.innerHTML = '<span style="color:#16a34a;">✅ 已复制历史战绩 ' + keys.length + ' 条策略 / ' + totalPeriods + ' 期，到另一台设备点「导入历史条目」粘贴即可。</span>';
        };
        const fallbackCopy = () => {
            try {
                const ta = document.createElement('textarea');
                ta.value = text;
                ta.style.position = 'fixed';
                ta.style.left = '-999999px';
                document.body.appendChild(ta);
                ta.focus();
                ta.select();
                document.execCommand('copy');
                ta.remove();
                done();
            } catch (e) {
                flashHistoryAction(btn, false, '复制成功', '复制失败');
                if (feedbackEl) feedbackEl.innerHTML = '<span style="color:#ef4444;">❌ 复制失败，请手动复制。</span>';
            }
        };
        if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(text).then(done).catch(fallbackCopy);
        else fallbackCopy();
    }

    // 文件导出：把本地战绩 JSON 下载为文件（跨设备迁移，另一台设备选择文件导入合并）
    function downloadImportHistories(btn, map, keys, totalPeriods, feedbackEl) {
        try {
            const text = JSON.stringify(map, null, 2);
            const blob = new Blob([text], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            const d = new Date();
            const p = (n) => String(n).padStart(2, '0');
            a.href = url;
            a.download = '历史条目_' + d.getFullYear() + p(d.getMonth() + 1) + p(d.getDate()) + '_' + p(d.getHours()) + p(d.getMinutes()) + p(d.getSeconds()) + '.json';
            document.body.appendChild(a);
            a.click();
            setTimeout(function() {
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
            }, 100);
            flashHistoryAction(btn, true, '导出成功', '导出失败');
            if (feedbackEl) feedbackEl.innerHTML = '<span style="color:#16a34a;">✅ 已导出历史战绩文件 ' + keys.length + ' 条策略 / ' + totalPeriods + ' 期，到另一台设备点「导入历史条目」选择文件导入即可。</span>';
        } catch (e) {
            flashHistoryAction(btn, false, '导出成功', '导出失败');
            if (feedbackEl) feedbackEl.innerHTML = '<span style="color:#ef4444;">❌ 文件导出失败，请改用「复制导出」。</span>';
        }
    }

    // 导入历史条目：点击弹小窗选择方式（粘贴导入 / 导入JSON文件）
    window.importImportHistories = function(btn) {
        const feedbackEl = document.getElementById('ext-strategy-feedback');
        showHistoryActionPicker(btn, [
            { text: '粘贴导入', color: '#15803d', action: function() { pasteImportHistories(btn, feedbackEl); } },
            { text: '导入JSON文件', color: '#1d4ed8', action: function() { importImportHistoriesFile(btn, feedbackEl); } }
        ]);
    };

    // 重置历史战绩：清空本机 zdr_import_history_v2（v1.67 新增；确认后清空，
    // 误操作可重新「导入历史条目」JSON 恢复，建议先「导出历史条目」备份）
    window.resetImportHistories = async function(btn) {
        const feedbackEl = document.getElementById('ext-strategy-feedback');
        const ok = await window.zdrConfirm('确定要清空全部历史条目吗？\n\n清空后需重新「导入历史条目」JSON 才能恢复（建议先「导出历史条目」备份一份）。', { danger: true, okText: '清空', cancelText: '取消' });
        if (!ok) return;
        try {
            localStorage.removeItem(IMPORT_HISTORY_KEY);
            __histMapCache = null; // 会话内历史表缓存同步失效
        } catch (e) { /* ignore */ }
        if (typeof renderImportList === 'function') renderImportList();
        flashHistoryAction(btn, true, '清空成功', '清空失败');
        if (feedbackEl) feedbackEl.innerHTML = '<span style="color:#16a34a;">✅ 历史条目已清空，请重新导入历史条目 JSON。</span>';
    };

    // 粘贴导入（原逻辑）：读剪贴板 / 弹窗粘贴 JSON 后合并（按策略键合并、按期数去重、最多保留 10 期）
    async function pasteImportHistories(btn, feedbackEl) {
        let text = '';
        try {
            text = await navigator.clipboard.readText();
        } catch (e) {
            text = await window.zdrPrompt('在下方粘贴历史战绩 JSON', { placeholder: '例如：{"macau|【琴棋书画】": {"periods": [...]}}' });
        }
        if (!text || !text.trim()) return;
        applyImportHistoriesText(text, btn, feedbackEl);
    }

    // 文件导入：选择 .json 文件读取后合并（粘贴与文件共用合并逻辑）
    function importImportHistoriesFile(btn, feedbackEl) {
        const input = document.createElement('input');
        input.type = 'file';
        input.accept = '.json,application/json';
        input.style.display = 'none';
        const cleanup = function() { if (input.parentNode) input.parentNode.removeChild(input); };
        input.addEventListener('cancel', cleanup, { once: true });
        input.addEventListener('change', function() {
            const file = input.files && input.files[0];
            if (!file) { cleanup(); return; }
            const reader = new FileReader();
            reader.onload = function() {
                applyImportHistoriesText(String(reader.result || ''), btn, feedbackEl, file.name);
                cleanup();
            };
            reader.onerror = function() {
                flashHistoryAction(btn, false, '导入成功', '导入失败');
                if (feedbackEl) feedbackEl.innerHTML = '<span style="color:#ef4444;">❌ 文件读取失败。</span>';
                cleanup();
            };
            reader.readAsText(file, 'utf-8');
        });
        document.body.appendChild(input);
        input.click();
        // 旧浏览器不支持 cancel 事件时兜底清理；保留足够时间，避免移动端选文件稍慢就失效。
        setTimeout(cleanup, 5 * 60 * 1000);
    }

    function resolveImportedHistoryLottery(k, h) {
        const fromKey = String(k || '').split('|')[0];
        const fromRecord = String(h && h.lottery || '');
        const keyValid = fromKey === 'macau' || fromKey === 'hk';
        const recordValid = fromRecord === 'macau' || fromRecord === 'hk';
        if (keyValid && recordValid && fromKey !== fromRecord) return '';
        return recordValid ? fromRecord : (keyValid ? fromKey : '');
    }

    function normalizeImportedHistoryPeriod(p) {
        if (!p || typeof p !== 'object') return null;
        const rawQishu = String(p.qishu == null ? '' : p.qishu).trim();
        if (!/^\d{1,4}$/.test(rawQishu)) return null;
        const qishu = parseInt(rawQishu, 10);
        if (!qishu) return null;
        let hit;
        if (p.hit === true || p.hit === 1 || p.hit === '1' || p.hit === 'true') hit = true;
        else if (p.hit === false || p.hit === 0 || p.hit === '0' || p.hit === 'false') hit = false;
        else return null;
        const clean = Object.assign({}, p, { qishu: String(qishu), hit: hit });
        ['partsText', 'tm', 'sx', 'wx', 'color'].forEach(function(field) {
            clean[field] = clean[field] == null ? '' : String(clean[field]);
        });
        return clean;
    }

    // 共用合并：解析并合并历史战绩 JSON（粘贴 / 文件两条路径共用）
    function applyImportHistoriesText(text, btn, feedbackEl, fileName) {
        const fromFile = !!fileName;
        let data;
        try { data = JSON.parse(text); } catch (e) {
            flashHistoryAction(btn, false, '导入成功', '导入失败');
            if (feedbackEl) feedbackEl.innerHTML = '<span style="color:#ef4444;">❌ ' + (fromFile ? '文件' : '粘贴') + '内容 JSON 格式错误，请检查。</span>';
            return;
        }
        // 兼容带版本包装的格式 {version:2, data:{...}} 与直接粘贴的战绩对象
        if (data && data.version === 2 && data.data && typeof data.data === 'object') data = data.data;
        if (!data || typeof data !== 'object' || Array.isArray(data)) {
            flashHistoryAction(btn, false, '导入成功', '导入失败');
            if (feedbackEl) feedbackEl.innerHTML = '<span style="color:#ef4444;">❌ 格式不正确：应为历史战绩 JSON 对象。</span>';
            return;
        }
        const map = loadImportHistories();
        const items = window.__importedStrategies || [];
        let mergedKeys = 0, mergedPeriods = 0, skippedKeys = 0, skippedPeriods = 0, pendingKeys = 0;
        Object.keys(data).forEach(k => {
            const h = data[k];
            if (!h || typeof h !== 'object' || !Array.isArray(h.periods) || !h.periods.length) { skippedKeys++; return; }
            const keyLottery = resolveImportedHistoryLottery(k, h);
            if (!keyLottery) { skippedKeys++; return; }
            const validPeriods = [];
            h.periods.forEach(function(p) {
                const clean = normalizeImportedHistoryPeriod(p);
                if (clean) validPeriods.push(clean); else skippedPeriods++;
            });
            if (!validPeriods.length) { skippedKeys++; return; }
            // 旧标题智能匹配：老 JSON（如 macau|【六尾必中特】）合并到当前已带网站标签的条目键下
            const keyTitle = String(h.title || historyTitleFromKey(k) || '');
            const parts = validPeriods[validPeriods.length - 1].partsText || '';
            const target = items.some(it => importHistoryKey(it) === k) ? null : findHistoryTarget(keyTitle, keyLottery, parts, items);
            if (!target && !items.some(it => importHistoryKey(it) === k)) pendingKeys++;
            const k2 = target ? importHistoryKey(target) : k;
            const prev = map[k2];
            const byQ = {};
            // 按期数数值去重：兼容 87 / 087 两种写法
            ((prev && prev.periods) || []).forEach(p => { if (p && p.qishu != null && !isNaN(parseInt(p.qishu, 10))) byQ[parseInt(p.qishu, 10)] = p; });
            let added = 0;
            validPeriods.forEach(p => {
                const q = parseInt(p.qishu, 10);
                if (!byQ[q]) { byQ[q] = p; added++; }
            });
            const merged = Object.keys(byQ).map(q => byQ[q]).sort((a, b) => parseInt(a.qishu, 10) - parseInt(b.qishu, 10)).slice(-IMPORT_HISTORY_LIMIT);
            map[k2] = { lottery: keyLottery, title: target ? String(target.title || '').replace(/^\s*\d{1,4}期[:：]?\s*/, '') : (h.title || historyTitleFromKey(k) || k), periods: merged, updatedAt: new Date().toISOString() };
            mergedKeys++;
            mergedPeriods += added;
        });
        if (!mergedKeys) {
            flashHistoryAction(btn, false, '导入成功', '导入失败');
            if (feedbackEl) feedbackEl.innerHTML = '<span style="color:#ef4444;">❌ 文件中没有可导入的有效历史记录。</span>';
            return;
        }
        if (!saveImportHistories(map)) {
            flashHistoryAction(btn, false, '导入成功', '导入失败');
            if (feedbackEl) feedbackEl.innerHTML = '<span style="color:#ef4444;">❌ 历史记录写入本机存储失败，请检查浏览器存储空间。</span>';
            return;
        }
        if (typeof renderImportList === 'function') renderImportList();
        flashHistoryAction(btn, true, '导入成功', '导入失败');
        if (feedbackEl) {
            const warnings = [];
            if (pendingKeys) warnings.push('其中 ' + pendingKeys + ' 条暂未关联当前清单，已保留待对应条目出现后自动匹配');
            if (skippedKeys || skippedPeriods) warnings.push('跳过无效策略 ' + skippedKeys + ' 条 / 无效期数 ' + skippedPeriods + ' 条');
            feedbackEl.innerHTML = '<span style="color:#16a34a;">✅ 已导入历史战绩 ' + mergedKeys + ' 条策略 / 新增 ' + mergedPeriods + ' 期' + (fromFile ? '（文件：' + escHtml(fileName) + '）' : '') + '。</span>'
                + (warnings.length ? '<br><span style="color:#b45309;">⚠️ ' + warnings.join('；') + '。</span>' : '');
        }
    }

    // 悬浮提示：属性值转义（在 escHtml 基础上再转双引号）
    function escAttr(s) {
        return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    // 悬浮提示用：把条目子选项文本中与当期开奖对应的项标红
    // （如 九肖 229期开 38/蛇 → 选肖里的“蛇”变红；男肖女肖、琴棋书画、大小单双等类别命中项同样标红）。
    // 判断复用 expandComboToken 的“类别/词条 → 号码集合”映射：当期特码落在该集合即命中；
    // 杀肖/杀尾/杀码等杀死类不标红（排除语义，开奖项本就不应出现在杀死列表里）
    function tipValueMatched(label, v, tm, color) {
        const tmStr = String(tm == null ? '' : tm);
        if (!tmStr) return false;
        if (/尾数/.test(label)) return v.replace(/尾$/, '') === tmStr.slice(-1);
        if (/头数/.test(label)) return v === tmStr.charAt(0);
        if (/波色/.test(label)) return !!color && v.indexOf(color) > -1;
        const nums = (typeof expandComboToken === 'function') ? expandComboToken(v) : null;
        return Array.isArray(nums) && nums.length > 0 && nums.indexOf(tmStr) > -1;
    }
    function highlightTipText(tipText, tm, color) {
        if (!tipText) return '';
        return String(tipText).split('；').map(seg => {
            const colon = seg.indexOf(':');
            if (colon < 0) return escHtml(seg);
            const label = seg.slice(0, colon).trim();
            const values = seg.slice(colon + 1).split(/\s+/).filter(Boolean);
            if (/杀/.test(label)) return escHtml(seg); // 杀死类（杀肖/杀尾/杀码…）不标红
            const rendered = values.map(v => {
                const ev = escHtml(v);
                return tipValueMatched(label, v, tm, color)
                    ? '<span style="color:#ef4444;font-weight:600;">' + ev + '</span>'
                    : ev;
            }).join(' ');
            return label + ':' + rendered;
        }).join('；');
    }

    // 悬浮历史期数 0.5 秒后显示该期条目的子选项
    // v1.86：电脑端悬停或点击显示、鼠标移开即关闭；移动端点击切换显示/关闭、点击空白处关闭
    // 桌面/触屏按运行时能力判定（hover + 精细指针视为电脑端），不按屏幕宽度，避免平板/触屏笔记本误判
    const __periodTipHoverCapable = !!(window.matchMedia && window.matchMedia('(hover: hover) and (pointer: fine)').matches);
    let __periodTipTimer = null;
    let __periodTipChip = null; // 当前弹窗对应的期数 chip（移动端再次点击同一条时关闭）
    function getPeriodTipEl() {
        let tip = document.getElementById('zdr-period-tooltip');
        if (!tip) {
            tip = document.createElement('div');
            tip.id = 'zdr-period-tooltip';
            tip.style.cssText = 'position:fixed;z-index:99999;background:#ffffff;border:1px solid #e2e8f0;border-radius:8px;box-shadow:0 4px 14px rgba(0,0,0,0.15);padding:8px 10px;font-size:0.75rem;color:#334155;max-width:min(280px, calc(100vw - 16px));pointer-events:none;display:none;word-break:break-all;';
            document.body.appendChild(tip);
        }
        return tip;
    }
    function showPeriodTooltip(evt, el, immediate) {
        hidePeriodTooltip();
        const qishu = el.getAttribute('data-qishu') || '';
        const hit = el.getAttribute('data-hit') === '1';
        const tipText = el.getAttribute('data-tip') || '';
        const tm = el.getAttribute('data-tm') || '';
        const sx = el.getAttribute('data-sx') || '';
        const wx = el.getAttribute('data-wx') || '';
        const color = el.getAttribute('data-color') || '';
        __periodTipChip = el;
        __periodTipTimer = setTimeout(function() {
            const tip = getPeriodTipEl();
            const colorHex = color === '红' ? '#ef4444' : (color === '蓝' ? '#2563eb' : (color === '绿' ? '#16a34a' : ''));
            let html = '<div style="font-weight:600;margin-bottom:4px;">' + escHtml(qishu) + '期开：';
            if (tm) {
                html += '<span style="color:' + colorHex + ';">' + escHtml(tm) + '</span>' + (sx ? ' / ' + escHtml(sx) : '') + (wx ? ' / ' + escHtml(wx) : '');
            }
            html += '<span style="margin-left:8px;background:' + (hit ? '#ef4444' : '#f1f5f9') + ';color:' + (hit ? '#fff' : '#94a3b8') + ';padding:3px 8px;border-radius:4px;font-weight:600;' + (hit ? 'box-shadow:0 1px 2px rgba(239,68,68,0.3);' : '') + '">' + (hit ? '中' : '错') + '</span></div>';
            html += tipText ? '<div style="line-height:1.6;">' + highlightTipText(tipText, tm, color) + '</div>' : '<div style="color:#94a3b8;">该期无子选项记录</div>';
            tip.innerHTML = html;
            // 先隐藏可见性但参与布局，量取真实宽高后再定位；
            // （display:none 时 offsetWidth/offsetHeight 恒为 0，四边钳制会失效，
            //   移动端靠边期数的弹窗就会溢出屏幕边缘被挡住）
            tip.style.visibility = 'hidden';
            tip.style.display = 'block';
            const r = el.getBoundingClientRect();
            const tw = tip.offsetWidth, th = tip.offsetHeight;
            const pad = 4, gap = 8;
            // 左右锚定：默认在期数右侧弹出；右侧放不下（靠右边缘的期数）改到左侧弹出，
            // 保证左侧边缘的期数弹窗往右排、右侧边缘的期数弹窗往左排、不贴屏幕边；
            // 极窄屏两侧都放不下时退回居中钳制，确保不溢出屏幕边缘
            let left = r.right + gap;
            if (left + tw > window.innerWidth - pad) left = r.left - gap - tw;
            if (left < pad) {
              left = r.left + r.width / 2 - tw / 2;
              left = Math.max(pad, Math.min(left, window.innerWidth - tw - pad));
            }
            let top = r.bottom + 6;
            if (top + th > window.innerHeight - pad) top = r.top - th - 6;
            if (top < pad) top = pad; // 上下都不够时贴顶，避免顶部被切
            tip.style.left = left + 'px';
            tip.style.top = top + 'px';
            tip.style.visibility = 'visible';
        }, immediate ? 0 : 500);
    }
    // 点击期数 chip：电脑端点击立即显示（鼠标移开由 mouseleave 关闭）；移动端再次点击同一条关闭
    function togglePeriodTooltip(evt, el) {
        if (evt && evt.stopPropagation) evt.stopPropagation();
        if (__periodTipHoverCapable) {
            showPeriodTooltip(evt, el, true);
            return;
        }
        if (__periodTipChip === el) {
            hidePeriodTooltip();
        } else {
            showPeriodTooltip(evt, el, true);
        }
    }
    function hidePeriodTooltip() {
        if (__periodTipTimer) { clearTimeout(__periodTipTimer); __periodTipTimer = null; }
        __periodTipChip = null;
        const tip = document.getElementById('zdr-period-tooltip');
        if (tip) tip.style.display = 'none';
    }
    // 点击期数之外的空白处/其他控件时关闭弹窗（移动端点空白取消；chip 的 onclick 已 stopPropagation）
    document.addEventListener('click', function(evt) {
        const t = evt && evt.target;
        if (t && t.closest && !t.closest('.zdr-import-period')) hidePeriodTooltip();
    });
    window.showPeriodTooltip = showPeriodTooltip;
    window.hidePeriodTooltip = hidePeriodTooltip;

    // ========== 新增：号码暂存（香港/新澳门分开，显示在自定义策略库上方） ==========
    const SAVED_NUMS_KEY = 'zdr_saved_numbers_v1';
    const SAVED_NUMS_LIMIT = 20;

    function loadSavedNumbers() {
        try {
            const raw = localStorage.getItem(SAVED_NUMS_KEY);
            const data = raw ? JSON.parse(raw) : null;
            if (data && typeof data === 'object' && !Array.isArray(data)) {
                if (!Array.isArray(data.macau)) data.macau = [];
                if (!Array.isArray(data.hk)) data.hk = [];
                return data;
            }
        } catch (e) { /* ignore */ }
        return { macau: [], hk: [] };
    }

    function saveSavedNumbers(data) {
        try {
            data.macau = (data.macau || []).slice(-SAVED_NUMS_LIMIT);
            data.hk = (data.hk || []).slice(-SAVED_NUMS_LIMIT);
            localStorage.setItem(SAVED_NUMS_KEY, JSON.stringify(data));
        } catch (e) { /* ignore */ }
    }

    // 当前预测期数（最新已开奖期 + 1；无数据时澳门按当天年内天数）
    function getCurrentPredictionPeriod(lottery) {
        const year = new Date().getFullYear();
        let max = 0;
        // 只基于新鲜数据计算当前期数，旧数据一律不算（否则本地旧数据会把暂存期数记成过期期数，如 157 期）
        getAllLotteryRecords(lottery, true).forEach(r => {
            const rYear = r.year != null ? parseInt(r.year, 10) : Math.floor(r.id / 1000);
            if (rYear === year && r.qishu != null) {
                const q = parseInt(r.qishu, 10);
                if (q > max) max = q;
            }
        });
        if (max) return max + 1;
        if (lottery === 'macau') {
            const d = new Date();
            const start = new Date(d.getFullYear(), 0, 0);
            return Math.floor((d - start) / 86400000);
        }
        return null;
    }

    // 读取输入框容器内当前显示的全部号码（来自手动选择/导入条目/分类筛选的结果）
    function readDisplayNumbers(container) {
        if (!container) return [];
        const tags = container.querySelectorAll('.num-tag');
        const seen = {};
        const nums = [];
        Array.from(tags).forEach(t => {
            const raw = String(t.textContent || '').trim().substring(0, 2);
            const v = parseInt(raw, 10);
            if (v >= 1 && v <= 49) {
                const p = String(v).padStart(2, '0');
                if (!seen[p]) { seen[p] = true; nums.push(p); }
            }
        });
        return nums.sort();
    }

    // 核心保存：写入指定彩种的暂存列表（成功时暂存按钮给反馈动画，不弹窗）
    function saveNumbersToStash(lottery, nums, btn) {
        const data = loadSavedNumbers();
        const periodNum = getCurrentPredictionPeriod(lottery);
        const period = periodNum != null ? (lottery === 'hk' ? String(periodNum).padStart(3, '0') : String(periodNum)) : '当期';
        data[lottery] = data[lottery] || [];
        // 与已保存的某组暂存号码完全重复时自动去重（不新增、不提示）
        const dup = data[lottery].some(s => s.nums && JSON.stringify(s.nums.slice().sort()) === JSON.stringify(nums));
        if (!dup) {
            data[lottery].push({ id: Date.now(), period: period, nums: nums, time: new Date().toISOString() });
            saveSavedNumbers(data);
        }
        refreshSavedNumbersPanel();
        if (btn && typeof window.showBtnFeedback === 'function') window.showBtnFeedback(btn, true, '存');

    // 刷新暂存面板：当前彩种没有暂存时整个容器隐藏

    }
    window.refreshSavedNumbersPanel = refreshSavedNumbersPanel;

    const IMPORT_CATS = ['numbers', 'frozen', 'firstDigit', 'color', 'element', 'weather', 'lastDigit', 'genderZodiac', 'size', 'oddEven', 'compositeOddEven', 'animalType', 'yinYangZodiac', 'season', 'art'];
    // 男肖/女肖生肖组（与页面自身 genderZodiacMap 定义一致）：用于把“男肖/女肖”展开成具体生肖号码
    const MALE_ZODIACS = '鼠牛虎龙马猴狗';
    const FEMALE_ZODIACS = '兔蛇羊鸡猪';

    function emptyImportAgg() {
        return { numbers: new Set(), frozen: new Set(), firstDigit: new Set(), color: new Set(), element: new Set(), weather: new Set(), lastDigit: new Set(), genderZodiac: new Set(), size: new Set(), oddEven: new Set(), compositeOddEven: new Set(), animalType: new Set(), yinYangZodiac: new Set(), season: new Set(), art: new Set() };

    // 加号合集子项 → 号码列表（null 表示无法识别）。支持：类别词条 / 生肖串 / 单个号码 / 五行单字
    // 用于 【单数+羊鸡】【家禽+鼠龙】【男肖+羊蛇】 等合集组合：每项展开为具体号码再并集
    function expandComboToken(token) {
        const t = String(token || '').replace(/[.、\s]/g, '');
        if (!t) return null;
        switch (t) {
            case '男肖': return [...new Set(Array.from(MALE_ZODIACS).flatMap(z => zodiacMap[z] || []))];
            case '女肖': return [...new Set(Array.from(FEMALE_ZODIACS).flatMap(z => zodiacMap[z] || []))];
            case '家禽': return animalTypeMap.poultry.slice();
            case '野兽': return animalTypeMap.beast.slice();
            case '阳肖': return yinYangZodiacMap.yang.slice();
            case '阴肖': return yinYangZodiacMap.yin.slice();
            case '大数': case '大': return sizeMap.big.slice();
            case '小数': case '小': return sizeMap.small.slice();
            case '单数': case '单': return oddEvenMapForCategory.odd.slice();
            case '双数': case '双': return oddEvenMapForCategory.even.slice();
            case '合数单': return compositeOddEvenMap.compositeOdd.slice();
            case '合数双': return compositeOddEvenMap.compositeEven.slice();
            case '风': return weatherMap.wind.slice();
            case '雨': return weatherMap.rain.slice();
            case '雷': return weatherMap.thunder.slice();
            case '电': return weatherMap.electric.slice();
            case '春': return seasonMap.spring.slice();
            case '夏': return seasonMap.summer.slice();
            case '秋': return seasonMap.autumn.slice();
            case '冬': return seasonMap.winter.slice();
            case '琴': return artMap.qin.slice();
            case '棋': return artMap.qi.slice();
            case '书': return artMap.shu.slice();
            case '画': return artMap.hua.slice();
            case '红波': return redNums.slice();
            case '蓝波': return blueNums.slice();
            case '绿波': return greenNums.slice();
        }
        if (/^\d{1,2}$/.test(t)) {
            const n = parseInt(t, 10);
            if (n >= 1 && n <= 49) return [n.toString().padStart(2, '0')];
        }
        const chars = Array.from(t);
        // 多字组词：全部由同一组字组成时逐字展开，如 风雨=风+雨、琴棋=琴+棋、春秋=春+秋
        const groupCharMaps = [
            { chars: { '风': 'wind', '雨': 'rain', '雷': 'thunder', '电': 'electric' }, map: weatherMap },
            { chars: { '春': 'spring', '夏': 'summer', '秋': 'autumn', '冬': 'winter' }, map: seasonMap },
            { chars: { '琴': 'qin', '棋': 'qi', '书': 'shu', '画': 'hua' }, map: artMap }
        ];
        for (const g of groupCharMaps) {
            if (chars.every(ch => g.chars[ch])) {
                return [...new Set(chars.flatMap(ch => g.map[g.chars[ch]] || []))];
            }
        }
        // 五行多字：如 金木、木火 逐字展开
        if (chars.length > 1 && chars.every(ch => '金木水火土'.includes(ch))) {
            return [...new Set(chars.flatMap(ch => elementMap[ch] || []))];
        }
        if (chars.length && chars.every(ch => zodiacMap[ch])) {
            return [...new Set(chars.flatMap(ch => zodiacMap[ch] || []))];
        }
        if (chars.length === 1 && elementMap[chars[0]]) return elementMap[chars[0]].slice();
        return null;
    }

    function escHtml(s) {
        return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
