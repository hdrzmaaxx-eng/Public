        }

        // 规则7：风雨雷电（占位内容如“？？？”不计入）
        const weatherMatch = str.match(/风雨雷电\s*『(.*?)』/);
        if (weatherMatch) {
            const wMap = {'风':'wind', '雨':'rain', '雷':'thunder', '电':'electric'};
            let added = 0;
            weatherMatch[1].split('').forEach(w => { if (wMap[w]) { parts.push({ cat: 'weather', label: '风雨雷电', value: wMap[w], display: w, kind: 'char' }); added++; } });
            if (added) hits.push("天气:" + weatherMatch[1]);
        }

        // 规则8：内幕波色（分位单双）如“内幕波色《红波》蓝双”或“内幕波色 〖红波+蓝双〗” → 红波单+红波双+蓝波双
        const nmbsIdx = str.indexOf('内幕波色');
        if (nmbsIdx > -1) {
            const seg = str.slice(nmbsIdx, nmbsIdx + 30);
            const waveColors = (seg.match(/([红蓝绿])波/g) || []).map(m => m.charAt(0));
            const sdMatches = seg.match(/([红蓝绿])?(单|双)/g) || [];
            if (waveColors.length) {
                const effSet = new Set();
                waveColors.forEach(c => { effSet.add(c + "波单"); effSet.add(c + "波双"); });
                const lastSd = sdMatches[sdMatches.length - 1];
                const sdM = lastSd ? lastSd.match(/([红蓝绿])?(单|双)/) : null;
                if (sdM && sdM[1]) effSet.add(sdM[1] + "波" + sdM[2]);
                effSet.forEach(eff => parts.push({ cat: 'color', label: '内幕波色', value: eff, display: eff, kind: 'effect' }));
                hits.push("<span style='color:#8b5cf6;'>内幕波色:</span> " + seg.replace(/\s+/g, ' ').trim());
            }
        }

        // 规则9：尾数（六尾⑱码等）如“六尾 1.4.5.6.7.9尾”
        const tailMatch = str.match(/(?:六尾|尾数)\s*[:：]?\s*([\d\.]+)/);
        if (tailMatch) {
            tailMatch[1].split('.').forEach(t => { if (t !== '') parts.push({ cat: 'lastDigit', label: '尾数', value: t, display: t, kind: 'digit' }); });
            hits.push("<span style='color:#0891b2;'>尾数:</span> " + tailMatch[1]);
        }

        // 规则10.5：括号内选男肖/女肖 + 具体生肖，如 男女中特【男肖+羊蛇】 → 男肖组 + 羊蛇
        // 全部并入 numbers 单一类别（并集），避免与页面交集筛选冲突（男肖∩羊蛇=空）
        // 优先于规则10：后面的 "女肖：… 男肖:…" 只是分组说明，不应被当成选入
        let genderBracketFired = false;
        const genderBracketRe = /[〖【]([^〗】]*(?:男肖|女肖)[^〗】]*)[〗】]/;
        const gbIdx = str.search(genderBracketRe);
        if (gbIdx > -1 && !/杀|禁/.test(str.slice(Math.max(0, gbIdx - 6), gbIdx))) {
            genderBracketFired = true;
            const gb = str.match(genderBracketRe)[1];
            const gbParts = gb.split(/[+＋]/).map(s => s.replace(/[.、\s]/g, '')).filter(Boolean);
            const addZodiacParts = chars => Array.from(chars).forEach(z => { if (zodiacMap[z]) parts.push({ cat: 'numbers', label: '男女中特', value: z, display: z, kind: 'zodiac' }); });
            gbParts.forEach(part => {
                if (part === '男肖') addZodiacParts(MALE_ZODIACS);
                else if (part === '女肖') addZodiacParts(FEMALE_ZODIACS);
                else addZodiacParts(part);
            });
            hits.push("<span style='color:#0d9488;'>男女中特:</span> " + gb);
        }

        // 规则10：男肖/女肖（兼容点号/顿号/空格分隔）；括号规则已命中则跳过，避免分组说明被误选入
        if (!genderBracketFired) {
            const genderRe = /(男肖|女肖)\s*[:：]?\s*((?:[鼠牛虎兔龙蛇马羊猴鸡狗猪][.、\s]*)+)/g;
            let gm;
            while ((gm = genderRe.exec(str)) !== null) {
                const gkey = gm[1] === '男肖' ? 'male' : 'female';
                const zods = gm[2].replace(/[.、\s]/g, '');
                if (zods.length) parts.push({ cat: 'genderZodiac', label: '男肖/女肖', value: gkey, display: gm[1], kind: 'effect' });
                hits.push("<span style='color:#0d9488;'>男肖/女肖:</span> " + gm[1] + ' ' + zods);
            }
        }

        // 规则11：标题兜底解析（正文缺类型词但标题有，如“【兄弟九肖】”“【疯狂尾数】”）
        if (!hits.length && title) {
            const t = String(title);
            // 选肖兜底：标题含 九肖/八肖/⑧肖 且非杀肖类 → 从正文括号取生肖串
            if (/(?:九|八|⑧|兄弟)肖/.test(t) && !/(?:绝杀|死杀|杀肖|禁)/.test(t)) {
                const zm2 = str.match(/[〖【]([鼠牛虎兔龙蛇马羊猴鸡狗猪]+)[〗】]/);
                if (zm2) {
                    let added = 0;
                    Array.from(zm2[1]).forEach(z => { if (zodiacMap[z]) { parts.push({ cat: 'numbers', label: '选肖', value: z, display: z, kind: 'zodiac' }); added++; } });
                    if (added) hits.push("<span style='color:#10b981;'>选肖(标题):</span> " + zm2[1]);
                }
            }
            // 尾数兜底：标题含“尾数” → 从正文提取 数字.数字…尾
            if (/尾数/.test(t)) {
                const tm2 = str.match(/([\d\.]+)\s*尾/);
                if (tm2) {
                    tm2[1].split('.').forEach(x => { if (x !== '') parts.push({ cat: 'lastDigit', label: '尾数', value: x, display: x, kind: 'digit' }); });
                    hits.push("<span style='color:#0891b2;'>尾数(标题):</span> " + tm2[1]);
                }
            }
        }

        parts.forEach(p => { if (p.checked === undefined) p.checked = true; });
        return { parts: parts, hits: hits };
    }

    // 由勾选的子选项汇总该条策略的贡献（规则语义与原实现一致：选肖/男女中特展开为具体号码，杀肖/男肖女肖等按组）
    function buildItemEffects(parts) {
        const effects = emptyImportAgg();
        parts.forEach(p => {
            if (p.checked === false) return;
            if (p.kind === 'zodiac') {
                if (p.cat === 'frozen') effects.frozen.add('zodiac:' + p.value);
                else if (zodiacMap[p.value]) zodiacMap[p.value].forEach(n => effects.numbers.add(n));
            } else if (p.kind === 'num') {
                effects.numbers.add(p.value);
            } else if (p.kind === 'digit') {
                if (p.cat === 'lastDigit') effects.lastDigit.add(p.value);
                else effects.firstDigit.add(p.value);
            } else if (p.kind === 'char') {
                if (p.cat === 'weather') effects.weather.add(p.value);
                else effects.element.add(p.value);
            } else if (p.kind === 'colorChar') {
                effects.color.add(p.value + '波单');
                effects.color.add(p.value + '波双');
            } else if (p.kind === 'effect') {
                if (p.cat === 'color') effects.color.add(p.value);
                else if (p.cat === 'weather') effects.weather.add(p.value);
                else if (p.cat === 'genderZodiac') effects.genderZodiac.add(p.value);
                else if (p.cat === 'lastDigit') effects.lastDigit.add(p.value);
                else if (p.cat === 'firstDigit') effects.firstDigit.add(p.value);
            }
        });
        return effects;
    }

    // 刷新所有按钮的冻结样式
    function refreshFrozenClasses() {
        document.querySelectorAll('.btn').forEach(btn => btn.classList.remove('frozen'));
        Array.from(frozenItems).forEach(itemKey => {
            const [cat, val] = itemKey.split(':');
            const btn = document.querySelector(`.btn[data-category="${cat}"][data-value="${val}"]`);
            if (btn) btn.classList.add('frozen');
        });
    }

    // 根据勾选状态重算导入贡献，并同步到页面状态（保留手动选择）
    // 聚合规则：选入类规则在勾选策略间取交集，并与手动选择取交集（由 updateDisplay 应用）；冻结/杀肖类规则取并集
    function syncImportState() {
        const newAgg = emptyImportAgg();
        const checkedItems = (window.__importedStrategies || []).filter(it => it.checked);
        // 选入类规则 = 交集，冻结/杀肖类规则 = 并集
        IMPORT_CATS.forEach(cat => {
            if (cat === 'frozen') {
                // 并集：任何一条勾选策略冻结/杀肖的都生效
                checkedItems.forEach(it => it.effects[cat].forEach(v => newAgg[cat].add(v)));
            } else {
                // 交集：仅在提供了该类别规则（集合非空）的勾选策略间取交集；未写该规则的策略视为无约束
                const providers = checkedItems.filter(it => it.effects[cat].size > 0);
                if (!providers.length) return;
                providers[0].effects[cat].forEach(v => newAgg[cat].add(v));
                for (let i = 1; i < providers.length; i++) {
                    const keep = newAgg[cat];
                    newAgg[cat] = new Set();
                    providers[i].effects[cat].forEach(v => { if (keep.has(v)) newAgg[cat].add(v); });
                }
            }
        });
        const oldAgg = window.__importedAgg || emptyImportAgg();
        // 冻结/杀肖类规则：并集，继续差分同步到 frozenItems
        oldAgg.frozen.forEach(v => { if (!newAgg.frozen.has(v)) frozenItems.delete(v); });
        newAgg.frozen.forEach(v => { if (!oldAgg.frozen.has(v)) frozenItems.add(v); });
        // 选入类规则（numbers/firstDigit/color/element/weather/lastDigit/genderZodiac）：
        // 不再并入 selectedOptions，保留在 __importedAgg 作为独立约束，
        // 由 updateDisplay 与手动选择取交集（任一侧为空则该类不约束）。
        window.__importedAgg = newAgg;
        refreshFrozenClasses();
        if (typeof syncUI === 'function') syncUI();
        if (typeof updateDisplay === 'function') updateDisplay();
    }

    // 渲染单条条目内可按类别点击启用的子选项（直接点击选项切换，不显示勾选框）
    function renderItemParts(itemIndex, it) {
        const parts = it.parts || [];
        if (!parts.length) return '';
        const groups = [];
        const groupMap = {};
        parts.forEach((p, pi) => {
            if (!groupMap[p.label]) { groupMap[p.label] = []; groups.push({ label: p.label, list: groupMap[p.label] }); }
            groupMap[p.label].push(pi);
        });
        const chipBase = 'display:inline-block;padding:1px 8px;border-radius:10px;cursor:pointer;margin:2px 4px 0 0;font-size:0.72rem;user-select:none;transition:background .15s;';
        return groups.map(g =>
            '<div style="margin:2px 0 0 21px;font-size:0.75rem;color:#64748b;line-height:1.7;">' + escHtml(g.label) + ': ' +
            g.list.map(pi => {
                const p = parts[pi];
                const on = it.checked && p.checked;
                const style = chipBase + (on ? 'background:#f59e0b;color:#fff;font-weight:600;' : 'background:#e2e8f0;color:#94a3b8;');
                return '<span onclick="window.toggleImportPart(' + itemIndex + ',' + pi + ')" title="点击启用/停用" style="' + style + '">' + escHtml(p.display) + '</span>';
            }).join('') + '</div>'
        ).join('');
    }

    // 渲染导入条目清单（条目级勾选保留；条目内子选项直接点击切换）
    function renderImportList() {
        const listEl = document.getElementById('ext-strategy-list');
        if (!listEl) return;
        const clearBtn = document.getElementById('ext-strategy-clear-btn');
        const items = window.__importedStrategies || [];
        if (!items.length) {
            listEl.innerHTML = '';
            if (clearBtn) clearBtn.style.display = 'none';
            updateToggleAllButton();
            return;
        }
        if (clearBtn) clearBtn.style.display = 'block';
        listEl.innerHTML =
            '<div style="margin:4px 0 2px;font-weight:600;">已导入条目（共 ' + items.length + ' 条，可在下方清单中勾选条目或点击条目内选项单独启用/停用。）</div>' +
            items.map((it, i) =>
                '<div style="padding:4px 0;border-bottom:1px dashed #fde68a;">' +
                '<label style="display:flex;align-items:center;gap:6px;cursor:pointer;">' +
                '<input type="checkbox" ' + (it.checked ? 'checked' : '') + ' onchange="window.toggleImportItem(' + i + ', this.checked)" style="width:15px;height:15px;flex-shrink:0;">' +
                '<span title="' + escHtml(it.latest_data || '') + '" style="' + (it.checked ? '' : 'color:#94a3b8;') + '">' + escHtml(it.title) + '</span>' +
                '</label>' +
                renderItemParts(i, it) +
                '</div>').join('');
        updateToggleAllButton();
    }
    window.renderImportList = renderImportList; // 供 IIFE 外部的 clearAllSelections 调用

    // 勾选/取消勾选某条导入；勾选时若条目内容全部停用则默认全部启用
    window.toggleImportItem = function(index, checked) {
        const items = window.__importedStrategies;
        if (!items || !items[index]) return;
        const it = items[index];
        it.checked = !!checked;
        if (it.checked && it.parts && it.parts.length && it.parts.every(p => !p.checked)) {
            it.parts.forEach(p => { p.checked = true; });
        }
        it.effects = buildItemEffects(it.parts || []);
        syncImportState();
        renderImportList();
    };

    // 点击条目内某个子选项：切换其启用状态并重算
    // 条目整体未勾选时，点击子选项 = 启用该条并只选中被点击的选项（避免反选其余选项）
    window.toggleImportPart = function(index, partIndex) {
        const items = window.__importedStrategies;
        const it = items && items[index];
        if (!it || !it.parts || !it.parts[partIndex]) return;
        if (!it.checked) {
            it.checked = true;
            it.parts.forEach(p => { p.checked = false; });
            it.parts[partIndex].checked = true;
        } else {
            it.parts[partIndex].checked = !it.parts[partIndex].checked;
        }
        // 子选项全部停用时，条目级勾选同步取消
        if (it.checked && it.parts.every(p => !p.checked)) it.checked = false;
        it.effects = buildItemEffects(it.parts);
        syncImportState();
        renderImportList();
    };

    // 同步“取消全选/全部启用”按钮的显示与文案
    function updateToggleAllButton() {
        const btn = document.getElementById('ext-strategy-toggle-all');
        if (!btn) return;
        const items = window.__importedStrategies || [];
        if (!items.length) { btn.style.display = 'none'; return; }
        btn.style.display = 'inline-block';
        btn.textContent = items.some(it => it.checked) ? '取消全选' : '全部启用';
    }

    // 一键全选/取消全选：有启用条目→全部取消（子选项状态保留）；无启用条目→全部启用（同时启用全部子选项）
    window.toggleAllImportItems = function() {
        const items = window.__importedStrategies || [];
        if (!items.length) return;
        const anyEnabled = items.some(it => it.checked);
        items.forEach(it => {
            it.checked = !anyEnabled;
            if (it.checked && it.parts && it.parts.length) {
                it.parts.forEach(p => { p.checked = true; });
            }
            it.effects = buildItemEffects(it.parts || []);
        });
        syncImportState();
        renderImportList();
    };

    // 清空导入清单（容器内按钮）：移除所有导入贡献并清空清单
    window.clearImportStrategies = function() {
        const items = window.__importedStrategies;
        if (items && items.length) {
            items.forEach(it => { it.checked = false; });
            syncImportState(); // 差分移除全部导入贡献并重算
            items.length = 0;
        }
        window.__importedAgg = null;
        renderImportList();
        const feedbackEl = document.getElementById('ext-strategy-feedback');
        if (feedbackEl) feedbackEl.innerHTML = '';
    };

    // ========== 页面内置自动获取兜底（无油猴脚本时可用） ==========
    // Kiwi 等移动浏览器对 file:// 页面不注入油猴脚本；改由本页面发隐藏 iframe 命令，
    // 依赖目标站点（http/https）上的油猴脚本提取数据并通过 postMessage 跨域回传。
    const PAGE_FETCH_SOURCES = [
        { url: 'https://wicyb.58345mr.app:5852/wz/thaothao.html', cmd: 'TSP_EXTRACT_CMD', name: '铁算盘', action: 'TSP_DATA_RETURN', key: 'TSP' },
        { url: 'https://mv3-k7p0n4x.n6q1x9p3h.dev:2028/yjjy/index.html', cmd: 'MACAU_EXTRACT_CMD', name: '澳门九龙网', action: 'MACAU_DATA_RETURN', key: 'MACAU' },
        { url: 'https://baiduaipa.559992ldkka10.top:40154/baidu/yjjy/', cmd: 'QYH_EXTRACT_CMD', name: '群英会', action: 'QYH_DATA_RETURN', key: 'QYH' }
    ];

    window.__pageAutoFetch = function(feedbackEl) {
        const inputEl = document.getElementById('ext-strategy-input');
        if (!inputEl || !feedbackEl) return;

        // 清理上一次兜底会话（监听器 / iframe / 回调）
        if (window.__pageFetchListener) window.removeEventListener('message', window.__pageFetchListener);
        (window.__pageFetchFrames || []).forEach(f => { try { if (f.parentNode) f.parentNode.removeChild(f); } catch (e) { /* ignore */ } });
        PAGE_FETCH_SOURCES.forEach(s => { window['__pageFetchResolve_' + s.key] = null; });

        const results = [];
        const failed = [];
        let pending = PAGE_FETCH_SOURCES.length;
        let finished = false;

        window.__pageFetchListener = function(event) {
            const s = PAGE_FETCH_SOURCES.find(src => src.action === (event.data && event.data.action));
            if (!s) return;
            const cb = window['__pageFetchResolve_' + s.key];
            if (cb) cb(event.data.payload);
        };
        window.addEventListener('message', window.__pageFetchListener);

        function finishOne(name, payload) {
            if (finished) return;
            pending--;
            const ok = Array.isArray(payload) ? payload.length > 0 : !!(payload && (payload.必中生肖 || (payload.文章列表 && payload.文章列表.length)));
            if (ok) results.push({ name: name, payload: payload });
            else failed.push(name);
            if (pending > 0) return;
            finished = true;
            window.removeEventListener('message', window.__pageFetchListener);
            window.__pageFetchListener = null;
            (window.__pageFetchFrames || []).forEach(f => { try { if (f.parentNode) f.parentNode.removeChild(f); } catch (e) { /* ignore */ } });

            const merged = [];
            results.forEach(r => {
                if (r.name === '铁算盘') {
                    const p = r.payload;
                    if (p.必中生肖 && p.必中生肖.九肖) merged.push({ title: p.必中生肖.title, latest_data: '九肖 ' + p.必中生肖.九肖 });
                    (p.文章列表 || []).forEach(a => { if (a.title && a.latest_data !== undefined) merged.push(a); });
                } else if (Array.isArray(r.payload)) {
                    r.payload.forEach(it => merged.push({ title: it.title || '未命名策略', latest_data: it.latest_data || '' }));
                }
            });
            if (!merged.length) {
                feedbackEl.innerHTML = '<span style="color:#ef4444;">❌ 自动获取失败：' + (failed.join('、') || '所有来源') + ' 未返回数据（请使用粘贴导入）。</span>';
                return;
            }
            try { if (typeof window.clearImportStrategies === 'function') window.clearImportStrategies(); } catch (e) { /* ignore */ }
            inputEl.value = JSON.stringify(merged);
            try { window.parseAndApplyExtStrategy(); } catch (e) { feedbackEl.innerHTML = '<span style="color:#ef4444;">❌ 解析导入失败：' + ((e && e.message) || e) + '</span>'; }
            if (failed.length) feedbackEl.innerHTML += '<br><span style="color:#d97706;">⚠️ ' + failed.join('、') + ' 未获取到数据。</span>';
        }

        feedbackEl.innerHTML = '<span style="color:#b45309;">⏳ 页面内置兜底拉取中（铁算盘/澳门九龙网/群英会），请稍候…</span>';
        const frames = [];
        PAGE_FETCH_SOURCES.forEach(s => {
            const frame = document.createElement('iframe');
            frame.style.cssText = 'display:none;width:0;height:0;border:0;';
            frame.src = s.url;
            document.body.appendChild(frame);
            frames.push(frame);
            let settled = false;
            const finish = payload => {
                if (settled) return;
                settled = true;
                window['__pageFetchResolve_' + s.key] = null;
                finishOne(s.name, payload);
            };
            window['__pageFetchResolve_' + s.key] = finish;
            let tries = 0;
            const attempt = () => {
                tries++;
                try { frame.contentWindow.postMessage({ action: s.cmd }, '*'); } catch (e) { /* ignore */ }
                if (!settled && tries < 5) setTimeout(attempt, 5000);
            };
            frame.addEventListener('load', () => { setTimeout(attempt, 1200); });
            frame.addEventListener('error', () => finish(null));
            setTimeout(() => { if (!settled) attempt(); }, 2000);
            setTimeout(() => finish(null), 30000);
        });
        window.__pageFetchFrames = frames;
    };

    // 切换“一键解析并选入 / 取消”共用按钮的状态
    window.__tspAutoFetchSetPending = function(pending) {
        const btn = document.getElementById('btn-parse-and-apply');
        window.__tspAutoFetchPending = !!pending;
        if (!btn) return;
        if (pending) {
            btn.textContent = '⏹ 取消';
            btn.style.background = 'linear-gradient(105deg, #ef4444, #dc2626)';
        } else {
            btn.textContent = '一键解析并选入';
            btn.style.background = 'linear-gradient(105deg, #f59e0b, #d97706)';
        }
    };

    window.parseAndApplyExtStrategy = function() {
        const inputEl = document.getElementById('ext-strategy-input');
        const feedbackEl = document.getElementById('ext-strategy-feedback');
        if (!inputEl || !feedbackEl) return;
        // 等待进行中：再次点击 = 取消自动获取
        if (window.__tspAutoFetchPending) {
            if (typeof window.cancelTspAutoFetch === 'function') window.cancelTspAutoFetch();
            else window.__tspAutoFetchSetPending(false);
            return;
        }
        const text = inputEl.value.trim();
        if (window.__tspWaitTimer) { clearTimeout(window.__tspWaitTimer); window.__tspWaitTimer = null; }
        if (!text) {
            // 空输入框时：若有油猴自动获取钩子，直接触发自动获取铁算盘数据
            if (typeof window.__tspAutoFetch === 'function') {
                window.__tspAutoFetch();
                window.__tspAutoFetchSetPending(true);
                return;
            }
            // 等待油猴钩子（移动端注入可能滞后）；约 2 秒仍无则启用页面内置兜底拉取
            if (window.__tspWaitTimer) { clearTimeout(window.__tspWaitTimer); window.__tspWaitTimer = null; }
            feedbackEl.innerHTML = '<span style="color:#b45309;">⏳ 正在等待脚本注入，请稍候…</span>';
            let waited = 0;
            const retry = () => {
                window.__tspWaitTimer = null;
                if (typeof window.__tspAutoFetch === 'function') {
                    window.__tspAutoFetch();
                    return;
                }
                waited += 400;
                if (waited < 2000) {
                    window.__tspWaitTimer = setTimeout(retry, 400);
                } else {
                    // 油猴脚本未注入（Kiwi 对 file:// 页面不注入）：改用页面内置兜底
                    if (typeof window.__pageAutoFetch === 'function') window.__pageAutoFetch(feedbackEl);
                    else feedbackEl.innerHTML = '<span style="color:#ef4444;">❌ 未检测到开奖数据跨域提取助手脚本，请确认已安装启用并刷新本页后再试。</span>';
                }
            };
            window.__tspWaitTimer = setTimeout(retry, 400);
            return;
        }
        try {
            const data = JSON.parse(text);
            if (!Array.isArray(data)) throw new Error();

            let importCount = 0;
            window.__importedStrategies = window.__importedStrategies || [];

            data.forEach(item => {
                const str = item.latest_data || "";
                const { parts, hits } = processImportedItem(str, item.title);
                if (!hits.length) {
                    console.warn('[导入] 未识别条目:', (item.title || '').slice(0, 30), '=>', (str || '').slice(0, 150));
                    return;
                }
                const title = item.title || '未命名策略';
                // 按“标题+内容”去重：重复粘贴不再堆积清单
                if ((window.__importedStrategies || []).some(it => it.title === title && it.latest_data === str)) return;
                importCount++;
                window.__importedStrategies.push({ title, latest_data: str, checked: true, parts: parts, effects: buildItemEffects(parts) });
            });

            syncImportState();
            renderImportList();

            if (importCount > 0) {
                feedbackEl.innerHTML = `✅ 识别并已导入条目 ${importCount} 条。`;
                inputEl.value = ""; // 解析成功后清空文本框方便下次操作
                window.scrollTo({ top: 0, behavior: 'smooth' });
            } else {
                feedbackEl.innerHTML = '<span style="color:#f59e0b;">⚠️ 解析完成，但未识别到新的系统规则标签。</span>';
                inputEl.value = ""; // 无论是否识别都清空输入框，避免残留整段 JSON 显示为“乱码”
            }
        } catch (e) {
            feedbackEl.innerHTML = '<span style="color:#ef4444;">❌ JSON 格式错误或解析失败，请检查复制内容。</span>';
        }
    };





    window.addEventListener("DOMContentLoaded", () => {
      const btnMacau = document.getElementById('btnMacau');
      const btnHk = document.getElementById('btnHk');
      if (btnMacau) btnMacau.addEventListener('click', () => switchLottery('macau'));
      if (btnHk) btnHk.addEventListener('click', () => switchLottery('hk'));

      // 外部策略输入框：电脑端支持拖入 .json 文件
      const extInput = document.getElementById('ext-strategy-input');
      const extFeedback = document.getElementById('ext-strategy-feedback');
      if (extInput) {
        extInput.addEventListener('dragover', (e) => { e.preventDefault(); extInput.style.borderColor = '#f59e0b'; extInput.style.background = '#fff7ed'; });
        extInput.addEventListener('dragleave', () => { extInput.style.borderColor = '#fcd34d'; extInput.style.background = '#fff'; });
        extInput.addEventListener('drop', (e) => {
          e.preventDefault();
          extInput.style.borderColor = '#fcd34d';
          extInput.style.background = '#fff';
          const file = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
          if (!file) return;
          if (!/\.json$/i.test(file.name)) {
            if (extFeedback) extFeedback.innerHTML = '<span style="color:#ef4444;">❌ 请拖入 .json 文件（当前：' + file.name + '）</span>';
            return;
          }
          const reader = new FileReader();
          reader.onload = () => {
            extInput.value = String(reader.result || '');
            if (extFeedback) extFeedback.innerHTML = '<span style="color:#10b981;">✅ 已读取文件：' + file.name + '，点击上方按钮解析选入（再拖一次可覆盖）。</span>';
          };
          reader.onerror = () => { if (extFeedback) extFeedback.innerHTML = '<span style="color:#ef4444;">❌ 文件读取失败</span>'; };
          reader.readAsText(file, 'utf-8');
        });
        // 阻止浏览器把拖到页面其他位置的文件直接打开
        window.addEventListener('dragover', (e) => e.preventDefault());
        window.addEventListener('drop', (e) => e.preventDefault());
      }



      // 页面打开或刷新时，默认在后台直接运行新澳门特码预测，提前缓存数据
      if (typeof window.runPredict === 'function') {
        window.runPredict();
        window._predictInitialized = true;
      }
    });






    // ==========================================
    // 监听滚动与拖动：控制悬浮气泡的显示、隐藏与拖拽定位
    // ==========================================
    (function() {
        const fabContainer = document.getElementById('strategyFabContainer');
        const fabBtn = document.getElementById('strategyFabBtn');
        const fabMenu = document.getElementById('strategyFabMenu');
        if (!fabContainer || !fabBtn) return;

        // 1. 监听滚动控制显示与隐藏
        window.addEventListener('scroll', function() {
            if (window.currentActiveTab !== 'predict') return;
            const panel = document.getElementById('strategy-panel');
            if (!panel) return;
            
            const rect = panel.getBoundingClientRect();
            if (rect.bottom < 0) {
                fabContainer.style.display = 'block';
            } else {
                fabContainer.style.display = 'none';
                if (fabMenu) fabMenu.classList.remove('show');
            }
        }, { passive: true });

        // 2. 拖拽逻辑实现 (手势拖动与PC鼠标拖动全兼容)
        let isDragging = false;
        let startX, startY;
        let initialLeft, initialTop;
        let hasMoved = false;
        const moveThreshold = 6; // 拖拽位移判定阈值(px)，防止点击气泡时手指轻微颤抖被误判成拖动

        function onStart(e) {
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;

            isDragging = true;
            hasMoved = false;

            const rect = fabContainer.getBoundingClientRect();
            initialLeft = rect.left;
            initialTop = rect.top;

            startX = clientX;
            startY = clientY;

            // 锁定绝对物理坐标：解除 right 和 bottom 属性的强绑定
            fabContainer.style.right = 'auto';
            fabContainer.style.bottom = 'auto';
            fabContainer.style.left = initialLeft + 'px';
            fabContainer.style.top = initialTop + 'px';
        }

        function onMove(e) {
            if (!isDragging) return;

            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;

            const dx = clientX - startX;
            const dy = clientY - startY;

            if (Math.abs(dx) > moveThreshold || Math.abs(dy) > moveThreshold) {
                hasMoved = true;
                if (fabMenu) fabMenu.classList.remove('show'); // 拖动过程中自动平滑收起菜单
            }

            let newLeft = initialLeft + dx;
            let newTop = initialTop + dy;

            // 屏幕边缘安全碰撞盒边界限制（各边留 10px 缓冲带）
            const pad = 10;
            const maxLeft = window.innerWidth - fabContainer.offsetWidth - pad;
            const maxTop = window.innerHeight - fabContainer.offsetHeight - pad;

            newLeft = Math.max(pad, Math.min(newLeft, maxLeft));
            newTop = Math.max(pad, Math.min(newTop, maxTop));

            fabContainer.style.left = newLeft + 'px';
            fabContainer.style.top = newTop + 'px';

            if (e.cancelable) e.preventDefault(); // 阻断并压制移动端屏幕默认的跟随弹性滚动
        }

        function onEnd() {
            if (!isDragging) return;
            isDragging = false;
        }

        // 注册拖拽监听总线
        fabBtn.addEventListener('mousedown', onStart);
        document.addEventListener('mousemove', onMove, { passive: false });
        document.addEventListener('mouseup', onEnd);

        fabBtn.addEventListener('touchstart', onStart, { passive: true });
        fabBtn.addEventListener('touchmove', onMove, { passive: false });
        fabBtn.addEventListener('touchend', onEnd);

        // 3. 自适应逻辑：防止拖拽结束后产生误点击并智能定位菜单弹窗朝向
        fabBtn.addEventListener('click', function(e) {
            e.stopPropagation();
            if (hasMoved) return; // 判定结果为拖动操作结束时，彻底物理阻断 click 行为

            if (fabMenu) {
                const rect = fabContainer.getBoundingClientRect();
                // 核心算法：以屏幕中心垂直线为界，智能判定悬浮球位置并倒置 origin 朝向
                const isLeftHalf = rect.left < window.innerWidth / 2;
                if (isLeftHalf) {
                    fabMenu.style.right = 'auto';
                    fabMenu.style.left = '0';
                    fabMenu.style.transformOrigin = 'bottom left';
                } else {
                    fabMenu.style.left = 'auto';
                    fabMenu.style.right = '0';
                    fabMenu.style.transformOrigin = 'bottom right';
                }
                fabMenu.classList.toggle('show');
            }
        });



        // 阻拦捕获：点击悬浮球外部任意区域自动收起菜单
        document.addEventListener('click', function(event) {
            if (fabContainer && fabMenu && fabMenu.classList.contains('show')) {
                if (!fabContainer.contains(event.target)) {
                    fabMenu.classList.remove('show');
                }
            }
        });

        // 窗口自适应防溢出边界纠正机制
        window.addEventListener('resize', function() {
            // 如果悬浮球未被拖拽过（依然使用原生CSS right/bottom 定位），则直接跳过无需干预
            if (!fabContainer || fabContainer.style.left === 'auto' || fabContainer.style.left === '') return;
            
            const pad = 10;
            const maxLeft = window.innerWidth - fabContainer.offsetWidth - pad;
            const maxTop = window.innerHeight - fabContainer.offsetHeight - pad;
            
            let currentLeft = parseFloat(fabContainer.style.left);
            let currentTop = parseFloat(fabContainer.style.top);
            
            // 如果当前绝对坐标超出了窗口缩放后的新边界，将其强行拉回贴边
            if (currentLeft > maxLeft) {
                fabContainer.style.left = Math.max(pad, maxLeft) + 'px';
            }
            if (currentTop > maxTop) {
                fabContainer.style.top = Math.max(pad, maxTop) + 'px';
            }
        }, { passive: true });
    })();

})();
</script>

<!-- ========== 通用自绘模态框（alert / confirm / prompt 替换原生调用） ========== -->
<div id="zdrDialogOverlay" class="zdr-modal-overlay">
    <div class="zdr-modal" role="dialog" aria-modal="true">
        <div class="zdr-modal-title" id="zdrDialogTitle"></div>
        <div class="zdr-modal-body" id="zdrDialogBody"></div>
        <input type="text" class="zdr-modal-input" id="zdrDialogInput" style="display:none;" autocomplete="off">
        <div class="zdr-modal-actions" id="zdrDialogActions"></div>
    </div>
</div>

<!-- ========== 新增：补充数据弹窗及逻辑 ========== -->
<div id="suppModalOverlay" class="supp-modal-overlay">
    <div class="supp-modal">
        <h3>手动补充开奖数据</h3>
        <div class="supp-form-group">
            <label>年份 (如: 2026)</label>
            <input type="number" id="supp-year" placeholder="请输入4位完整年份">
        </div>
        <div class="supp-form-group">
            <label>期数 (如: 199)</label>
            <input type="number" id="supp-qishu" placeholder="请输入期数">
        </div>
        <div class="supp-form-group">
            <label>开奖号码 (逗号或空格分隔，含特码)</label>
            <input type="text" id="supp-nums" placeholder="例: 17,49,42,45,05,38,36">
        </div>
        <div class="supp-actions">
            <button class="supp-btn-cancel" onclick="window.closeSuppModal()">取消</button>
            <button class="supp-btn-save" onclick="window.saveSuppData()">匹配并保存</button>
        </div>
    </div>
</div>

<script>
// 弹窗开关控制
window.openSuppModal = function() {
    document.getElementById('suppModalOverlay').style.display = 'flex';
    // 默认填充当前年份
    if(!document.getElementById('supp-year').value) {
        document.getElementById('supp-year').value = new Date().getFullYear();
    }
};
window.closeSuppModal = function() {
    document.getElementById('suppModalOverlay').style.display = 'none';
};

// ========== 通用自绘模态框引擎：替换原生 alert / confirm / prompt ==========
(function() {
    const overlay = document.getElementById('zdrDialogOverlay');
    const titleEl = document.getElementById('zdrDialogTitle');
    const bodyEl = document.getElementById('zdrDialogBody');
    const inputEl = document.getElementById('zdrDialogInput');
    const actionsEl = document.getElementById('zdrDialogActions');
    if (!overlay) return;

    let activeResolve = null; // 当前弹窗的 Promise 回调
    let promptMode = false;   // 是否为输入框模式（Esc / 遮罩 = null）

    function closeDialog(result) {
        overlay.classList.remove('show');
        overlay.style.display = 'none';
        actionsEl.innerHTML = '';
        inputEl.style.display = 'none';
        inputEl.value = '';
        promptMode = false;
        document.removeEventListener('keydown', onKeydown);
        const resolve = activeResolve;
        activeResolve = null;
        if (resolve) resolve(result);
    }

    function onKeydown(e) {
        if (e.key === 'Escape') {
            e.preventDefault();
            closeDialog(promptMode ? null : false);
        } else if (e.key === 'Enter' && promptMode) {
            e.preventDefault();
            closeDialog(inputEl.value);
        }
    }
    overlay.addEventListener('click', function(e) {
        if (e.target === overlay) closeDialog(promptMode ? null : false);
    });

    function openDialog(opts) {
        return new Promise(function(resolve) {
            activeResolve = resolve;
            titleEl.textContent = opts.title || '';
            bodyEl.textContent = opts.message || '';
            if (opts.input) {
                promptMode = true;
                inputEl.placeholder = opts.placeholder || '';
                inputEl.value = opts.defaultValue !== undefined && opts.defaultValue !== null ? String(opts.defaultValue) : '';
                inputEl.style.display = 'block';
            }
            (opts.buttons || []).forEach(function(b) {
                const btn = document.createElement('button');
                btn.textContent = b.text;
                btn.className = b.className || 'zdr-btn-cancel';
                btn.onclick = function() { closeDialog(b.value === '__INPUT__' ? inputEl.value : b.value); };
                actionsEl.appendChild(btn);
            });
            overlay.style.display = 'flex';
            overlay.classList.add('show');
            document.addEventListener('keydown', onKeydown);
            if (promptMode) setTimeout(function() { try { inputEl.focus(); } catch (e) { /* ignore */ } }, 30);
        });
    }

    window.zdrAlert = function(message, opts) {
        opts = opts || {};
        const type = opts.type || 'info';
        const btnClass = type === 'success' ? 'zdr-btn-green' : (type === 'error' ? 'zdr-btn-danger' : 'zdr-btn-primary');
        return openDialog({
            title: opts.title || (type === 'success' ? '✅ 操作成功' : type === 'error' ? '❌ 提示' : '提示'),
            message: message,
            buttons: [{ text: opts.okText || '确定', className: btnClass, value: true }]
        });
    };

    window.zdrConfirm = function(message, opts) {
        opts = opts || {};
        const okClass = opts.danger ? 'zdr-btn-danger' : 'zdr-btn-primary';
        return openDialog({
            title: opts.title || '请确认',
            message: message,
            buttons: [
                { text: opts.cancelText || '取消', className: 'zdr-btn-cancel', value: false },
                { text: opts.okText || '确定', className: okClass, value: true }
            ]
        });
    };

    window.zdrPrompt = function(message, opts) {
        opts = opts || {};
        return openDialog({
            title: opts.title || '请输入',
            message: message,
            input: true,
            placeholder: opts.placeholder || '',
            defaultValue: opts.defaultValue,
            buttons: [
                { text: '取消', className: 'zdr-btn-cancel', value: null },
                { text: '确定', className: 'zdr-btn-primary', value: '__INPUT__' }
            ]
        });
    };
})();

// 工具1：获取特定年份特定号码的生肖
window.getZodiacForYearAndNum = function(num, year) {
    var offset = (year - 2026) % 12;
    if (offset < 0) offset += 12; 
    var map = {};
    zodiacOrder.forEach(function(zodiac, index) {
        var shiftedIndex = (index + offset) % 12;
        map[zodiac] = baseZodiacMap[zodiacOrder[shiftedIndex]];
    });
    for (var z in map) {
        if (map[z].includes(num)) return z;
    }
    return "?";
};

// 工具2：获取特定号码的五行（避免局部作用域隔离，独立实现）
window.getElementForNum = function(num) {
    var eMap = {
        '金': ['04','05','12','13','26','27','34','35','42','43'],
        '木': ['08','09','16','17','24','25','38','39','46','47'],
        '水': ['01','14','15','22','23','30','31','44','45'],
        '火': ['02','03','10','11','18','19','32','33','40','41','48','49'],
        '土': ['06','07','20','21','28','29','36','37']
    };
    for (var e in eMap) {
        if (eMap[e].includes(num)) return e;
    }
    return "?";
};

// 保存补充数据事件
window.saveSuppData = function() {
    var year = document.getElementById('supp-year').value.trim();
    var qishu = document.getElementById('supp-qishu').value.trim();
    var numsInput = document.getElementById('supp-nums').value.trim();

    if (!year || !qishu || !numsInput) {
        window.zdrAlert("请填写完整的年份、期数和号码！", { type: "error" });
        return;
    }

    // 支持逗号、中文逗号、空格分隔，并过滤空值、强转两位数填充
    var nums = numsInput.split(/[,，\s]+/).filter(function(n) { return n !== ""; }).map(function(n) {
        return n.padStart(2, '0');
    });

    if (nums.length === 0) {
        window.zdrAlert("未识别到有效号码，请检查输入格式！", { type: "error" });
        return;
    }

    // 自动匹配生肖和五行
    var yearInt = parseInt(year);
    var sxs = nums.map(function(n) { return window.getZodiacForYearAndNum(n, yearInt); });
    var wxs = nums.map(function(n) { return window.getElementForNum(n); }); 

    // 生成 API 兼容的标准记录对象
    var record = {
        id: parseInt(year + qishu.padStart(3, '0')),
        year: yearInt,
        qishu: qishu.padStart(3, '0'),
        date: year + '-手动补充',
        num: nums.join(','),
        shengxiao: sxs.join(','),
        wuxing: wxs.join(',')
    };

    // 存入当前彩种专属的 localStorage
    var storageKey = 'zdr_manual_data_' + currentLottery;
    var manualDataStr = localStorage.getItem(storageKey);
    var manualData = manualDataStr ? JSON.parse(manualDataStr) : [];
    
    // 过滤掉相同 id 的旧数据，防止因修改导致的重复写入
    manualData = manualData.filter(function(d) { return d.id !== record.id; });
    manualData.push(record);
    
    localStorage.setItem(storageKey, JSON.stringify(manualData));

    window.zdrAlert("✅ 数据补充成功！系统已自动为您匹配：\n生肖：" + sxs.join(',') + "\n五行：" + wxs.join(',') + "\n\n弹窗关闭后系统将自动重新获取并应用数据。", { type: "success", title: "补充成功" });
    
    window.closeSuppModal();
    
    // 清空输入框状态，保留年份提升录入效率
    document.getElementById('supp-qishu').value = '';
    document.getElementById('supp-nums').value = '';

    // 重新运行预测流，新数据将无缝合并
    if (typeof window.runPredict === 'function') {
        window.runPredict();
    }
};
</script>

</body>
